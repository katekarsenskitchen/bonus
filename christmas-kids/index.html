<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cookie Time Play</title>
<style>
:root{--bg:#fbf4ea;--ink:#3a2a22;--red:#8c1d2c;--pine:#2f6b4f;--gold:#e8a317;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:manipulation}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
h1{font-size:20px;margin:0;color:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;padding:14px 4px;border:3px solid var(--red);border-radius:18px;background:#fff;color:var(--red);font-weight:700;font-size:16px}
.tab.on{background:var(--red);color:#fff}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{flex:1;min-height:0;background:var(--card);border-radius:24px;border:3px solid #e9dccb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage svg{width:100%;height:100%;max-height:100%}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px #d9c9b5}
.sw.on{box-shadow:0 0 0 5px var(--ink)}
.btn{min-width:64px;height:54px;padding:0 14px;border-radius:16px;border:3px solid var(--pine);background:#fff;color:var(--pine);font-weight:700;font-size:16px}
.btn.on{background:var(--pine);color:#fff}
.btn svg{width:34px;height:34px;vertical-align:middle}
.hide{display:none!important}
#match{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;width:100%;height:100%}
.mc{border-radius:18px;background:var(--red);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 3px #e9dccb;position:relative}
.mc svg{width:70%;height:70%;display:none}
.mc.up{background:#fff}.mc.up svg{display:block}.mc.done{background:#e4f2e8;opacity:.9}
.mc:not(.up):after{content:"★";color:var(--gold);font-size:34px}
.msg{text-align:center;font-weight:700;color:var(--pine);min-height:24px}
.note{font-size:11px;text-align:center;color:#8a7766;padding:4px 0}
.spr{pointer-events:none}
#spage{display:flex;flex-direction:column;width:100%;height:100%}
#sart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fdf0dc}
#sart img{max-width:100%;max-height:100%;object-fit:contain}
#sart .em{font-size:84px}
#sart.bump{animation:bump .35s}@keyframes bump{50%{transform:scale(1.06)}}
#stext{font-size:21px;line-height:1.4;padding:10px 14px;text-align:center;font-weight:600}
.w{padding:1px 2px;border-radius:6px}.w.on{background:#ffd86b}
</style></head><body>
<header><h1>Cookie Time Play</h1><button class="btn" id="snd" aria-label="Sound">🔊</button></header>
<div class="tabs"><button class="tab on" data-t="tree">Tree</button><button class="tab" data-t="cookie">Cookies</button><button class="tab" data-t="match">Match</button><button class="tab" data-t="story">Story</button></div>
<main>
<section id="p-tree" class="pane" style="display:contents">
 <div class="stage"><svg id="tree" viewBox="0 0 300 400"></svg></div>
 <div class="bar" id="treeTools"><button class="btn on" data-m="paint">Paint</button><button class="btn" data-m="orn">Ornaments</button><button class="btn" data-m="erase">Eraser</button><button class="btn" id="treeUndo">Undo</button><button class="btn" id="treeClr">New</button></div>
 <div class="bar hide" id="shapes"></div>
 <div class="bar" id="treeCol"></div>
</section>
<section id="p-cookie" class="pane" style="display:none">
 <div class="stage"><svg id="cookie" viewBox="0 0 300 300"></svg></div>
 <div class="bar" id="cookTools"></div><div class="bar" id="cookCol"></div>
</section>
<section id="p-match" class="pane" style="display:none"><div class="stage"><div id="match"></div></div><div class="msg" id="msg"></div><div class="bar"><button class="btn" id="mnew">Play again</button></div></section>
<section id="p-story" class="pane" style="display:none">
 <div class="stage"><div id="spage"><div id="sart"></div><div id="stext"></div></div></div>
 <div class="bar"><button class="btn" id="sprev" aria-label="Previous page">◀</button><button class="btn on" id="slisten">▶ Listen</button><button class="btn" id="snext" aria-label="Next page">▶</button></div>
 <div class="bar"><button class="btn" id="srec">● Mom's voice</button><button class="btn" id="svoice">Voice</button><button class="btn" id="sspeed">Speed: Normal</button><button class="btn hide" id="sdel">Delete</button></div><div class="msg" id="smsg"></div>
</section>
</main>
<div class="note">A grown-up should stay nearby. Mom's voice stays on this device and is lost when the page closes. Nothing is sent or collected.</div>
