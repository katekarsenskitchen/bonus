<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hidden-Protein Recipe Finder</title>
<meta name="theme-color" content="#1F4E3D">
<style>
:root{--g:#1F4E3D;--gd:#163a2d;--go:#E3B02F;--cr:#FFF9EC;--dk:#23312B;--mid:#6B7A72;--lt:#EEF3EE;--card:#fff;--line:#e3e9e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cr);color:var(--dk);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;cursor:pointer}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header.top{background:var(--g);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header.top h1{font-size:20px;color:#fff}
header.top p{margin:2px 0 0;font-size:13px;color:#cfe0d6}
.wrap{padding:16px}
nav.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.bar .in{display:flex;max-width:720px;width:100%}
nav.bar button{flex:1;border:0;background:none;padding:10px 4px 9px;color:var(--mid);font-size:12px;font-weight:600}
nav.bar button b{display:block;font-size:20px;line-height:1.1}
nav.bar button.on{color:var(--g)}
.chip{display:inline-block;border:1.5px solid var(--line);background:#fff;color:var(--dk);padding:7px 12px;border-radius:999px;margin:0 6px 8px 0;font-size:14px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--g);font-weight:700;margin:16px 0 8px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.card img{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:none;background:var(--lt)}
.card h3{font-size:16px;line-height:1.2;margin-bottom:3px}
.meta{font-size:13px;color:var(--mid)}
.badge{display:inline-block;background:var(--lt);color:var(--g);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;margin-right:6px}
.match{height:6px;background:var(--lt);border-radius:3px;margin:6px 0 4px;overflow:hidden}.match i{display:block;height:100%;background:var(--go)}
input[type=search]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;margin-bottom:10px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.alt{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.go{background:var(--go);color:#23312B}
.btn.sm{padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.view{position:fixed;inset:0;background:var(--cr);z-index:20;overflow:auto}
.view .in{max-width:720px;margin:0 auto;padding-bottom:40px}
.hero{width:100%;aspect-ratio:1/1;max-height:420px;object-fit:cover;display:block;background:var(--lt)}
.vtop{position:sticky;top:0;display:flex;justify-content:space-between;padding:10px 12px;background:rgba(255,249,236,.94);z-index:3}
.round{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:18px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);background:var(--g);color:#fff;border-radius:14px;padding:12px 4px;text-align:center;margin:12px 0}
.macros b{display:block;font-size:20px}.macros span{font-size:11px;letter-spacing:.06em}
.note{font-size:12px;color:var(--mid)}
h2.sec{font-size:18px;color:var(--g);border-bottom:2px solid var(--go);padding-bottom:4px;margin:20px 0 10px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ul.ing input{width:20px;height:20px;accent-color:var(--g);flex:none;margin-top:2px}
ol.steps{padding-left:0;list-style:none;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:26px}
.tip{background:#FBF1D2;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--g);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--g);padding:7px 12px;font-weight:700}.seg button.on{background:var(--g);color:#fff}
.cook{position:fixed;inset:0;background:var(--g);color:#fff;z-index:30;display:flex;flex-direction:column;padding:16px;overflow:auto}
.cook .in{max-width:640px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.cook .prog{height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin:10px 0 18px}.cook .prog i{display:block;height:100%;background:var(--go);border-radius:3px}
.cook .txt{font-size:24px;line-height:1.4;flex:1}
.cook .tip{background:rgba(255,255,255,.14);color:#fff;font-size:17px;padding:12px}
.cook .btn{background:#fff;color:var(--g)}.cook .btn.go{background:var(--go);color:#23312B}
.timer{font-size:44px;font-weight:700;text-align:center;margin:14px 0}
.empty{color:var(--mid);text-align:center;padding:30px 10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#23312B;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}
a{color:var(--g)}
.foot{font-size:12px;color:var(--mid);margin-top:24px}
</style></head><body>
<div id="app"></div>
<nav class="bar"><div class="in" id="nav"></div></nav>
<script>
const DATA={"R":[{"n":1,"t":"Loaded Breakfast Burritos","ch":"1 Easy Mornings","sv":6,"pr":15,"ck":15,"ing":[["egg whole raw",500],["black beans canned",250],["cheddar cheese",150],["flour tortilla 10 inch",384],["salsa",120],["bell pepper red raw",100],["olive oil",10],["green onion raw",30]],"st":["Dice the red bell pepper and slice the green onion. Warm the black beans in a small pot over low heat, or in the microwave for 1 minute.","Heat the olive oil in a large nonstick skillet over medium heat. Cook the pepper 3 to 4 minutes, stirring, until it starts to soften.","Beat the eggs with a pinch of salt and pepper. Pour into the skillet and stir gently with a spatula, pushing the eggs from the edges to the center, for 2 to 3 minutes until just set but still glossy.","Take the pan off the heat. Fold in the warm beans, cheddar, green onion and salsa so the cheese melts into the eggs.","Warm the tortillas 15 seconds each in the microwave so they fold without cracking. Spoon about 1/2 cup filling onto each, fold in the sides and roll up tightly.","For a crisp outside, toast the burritos seam side down in a dry skillet over medium heat 1 minute per side. Serve with extra salsa."],"tp":{"1":"Cut the pepper small, about 1/4 inch, so it softens in 3 to 4 minutes.","2":"Keep the heat at medium. Eggs cooked too hot turn rubbery. Take them off while they still look a little wet.","5":"Wrapped in foil, the burritos keep in the freezer; reheat from frozen."},"store":"Fridge 4 days. Freezer 2 months, wrapped in foil. Microwave 90 seconds.","kcal":480,"p":25,"f":23,"c":43,"tags":["freezer"]},{"n":2,"t":"Sausage Egg Muffin Sandwiches","ch":"1 Easy Mornings","sv":4,"pr":10,"ck":20,"ing":[["english muffin",228],["egg whole raw",200],["turkey breakfast sausage raw",340],["cheddar cheese",80],["butter",10]],"st":["Divide the sausage into 4 portions and press each into a thin patty about 4 inches wide, a little wider than the muffin, since it shrinks as it cooks.","Cook the patties in a dry nonstick skillet over medium heat 4 to 5 minutes per side, until deep golden and 165\u00b0F inside. Move to a plate.","Melt the butter in the same skillet over medium-low heat. Crack in the eggs and cook 2 to 3 minutes. Flip and cook 1 more minute until the yolks are set. Season with salt and pepper.","Split and toast the muffins until golden. While they are warm, lay a slice of cheddar on the bottom half so it softens.","Stack each sandwich: cheese on the muffin, then sausage, then egg, then the top half. Serve warm."],"tp":{"0":"Pressing a small dimple in the center of each patty keeps it flat while cooking.","2":"For a runny yolk, cook only 2 minutes on the first side and flip for 30 seconds."},"store":"Fridge 4 days. Freezer 2 months, wrapped. Microwave 60 to 90 seconds.","kcal":436,"p":31,"f":21,"c":28,"tags":["freezer","protein25"]},{"n":3,"t":"Ham and Cheddar Egg Squares","ch":"1 Easy Mornings","sv":6,"pr":10,"ck":25,"ing":[["egg whole raw",600],["ham deli sliced",250],["cheddar cheese",120],["milk 2%",120],["green onion raw",30],["olive oil",5]],"st":["Heat the oven to 375\u00b0F. Brush an 8x8-inch baking dish with the olive oil.","Chop the ham into small pieces and slice the green onion. Spread the ham, cheddar and onion evenly over the bottom of the dish.","Whisk the eggs and milk with 1/4 teaspoon pepper until no streaks of white remain. Pour slowly over the ham and cheese.","Bake 22 to 25 minutes, until the center is set and no longer jiggles when you shake the dish, and the top is lightly golden.","Rest 5 minutes so the squares cut cleanly, then cut into 6 squares."],"tp":{"2":"Whisk well so the milk and eggs are fully mixed. This gives an even, tender texture.","3":"The squares are done when the center springs back when you press it lightly."},"store":"Fridge 5 days. Freezer 2 months.","kcal":311,"p":25,"f":21,"c":4,"tags":["freezer"]},{"n":4,"t":"Apple Cinnamon Oatmeal with a Yogurt Swirl","ch":"1 Easy Mornings","sv":4,"pr":5,"ck":12,"ing":[["rolled oats",180],["milk 2%",480],["apple raw",360],["cinnamon ground",4],["maple syrup",40],["greek yogurt plain nonfat",400],["walnuts",40]],"st":["Peel and dice the apple into 1/2-inch pieces. Chop the walnuts.","In a medium pot, combine the oats, milk, apple and cinnamon. Bring to a gentle simmer over medium heat, stirring.","Reduce the heat to medium-low and cook 8 to 10 minutes, stirring often, until the oats are creamy and the apple is tender.","Stir in the maple syrup and take the pot off the heat. The oatmeal will thicken a little as it stands.","Divide among 4 bowls. Spoon about 1/2 cup of yogurt on each and swirl it through with a spoon, then top with the chopped walnuts."],"tp":{"2":"Stir often so the oats do not stick to the bottom of the pot.","4":"Swirl the yogurt gently. Do not mix it in completely so you keep pockets of tangy yogurt."},"store":"Fridge 4 days without yogurt. Reheat with a splash of milk.","kcal":435,"p":24,"f":13,"c":60,"tags":["quick"]},{"n":5,"t":"Peanut Butter Banana Overnight Oats","ch":"1 Easy Mornings","sv":4,"pr":10,"ck":0,"ing":[["rolled oats",160],["greek yogurt plain nonfat",480],["milk 2%",240],["peanut butter",64],["banana raw",236],["chia seeds",24],["honey",40]],"st":["Slice the banana. Set half aside for topping and mash the other half with a fork.","In a large bowl, whisk the yogurt, milk, peanut butter and honey until smooth. If the peanut butter is stiff, warm it 10 seconds in the microwave first.","Stir in the oats, chia seeds and the mashed banana until everything is evenly wet.","Divide among 4 jars or containers, cover and refrigerate at least 6 hours or overnight, until the oats are soft and thick.","Stir before serving. If it is too thick, add a splash of milk. Top with the remaining banana slices."],"tp":{"1":"Soft, ripe bananas mash better and make the oats sweeter.","3":"Jars with a tight lid are best: you can shake them to mix before eating."},"store":"Fridge 4 days. Do not freeze.","kcal":464,"p":26,"f":15,"c":62,"tags":["quick","protein25"]},{"n":6,"t":"Crispy Yogurt Waffles","ch":"1 Easy Mornings","sv":4,"pr":10,"ck":20,"ing":[["all-purpose flour",100],["greek yogurt plain nonfat",360],["egg whole raw",200],["milk 2%",120],["baking powder",8],["butter",42],["maple syrup",60]],"st":["Heat the waffle iron. Melt the butter and let it cool 2 minutes so it does not cook the eggs.","In a large bowl, whisk the yogurt, eggs and milk until smooth, then whisk in the melted butter.","Add the flour and baking powder and stir just until no dry flour remains. A few small lumps are fine; overmixing makes waffles tough.","Lightly grease the iron. Pour in about 1/2 cup batter and close the lid. Cook 4 to 5 minutes, until golden and the steam slows.","Move the waffles to a wire rack, not a plate, so they stay crisp. Serve warm with maple syrup."],"tp":{"2":"Do not overmix the batter. Small lumps are fine and keep the waffles light.","3":"Waiting until the steam slows tells you the waffle is crisp and ready to lift."},"store":"Fridge 4 days. Freezer 2 months. Re-crisp in a toaster.","kcal":346,"p":19,"f":14,"c":35,"tags":["freezer"]},{"n":7,"t":"Potato and Sausage Breakfast Skillet","ch":"1 Easy Mornings","sv":4,"pr":10,"ck":30,"ing":[["potato raw",600],["turkey breakfast sausage raw",340],["egg whole raw",200],["bell pepper red raw",150],["yellow onion raw",100],["olive oil",20],["paprika",3]],"st":["Dice the potatoes into 1/2-inch cubes, dice the pepper and onion, and keep the sausage ready to crumble.","Heat the oil in a large skillet over medium-high heat. Add the potatoes in one layer and cook 12 minutes, turning every few minutes, until golden and tender.","Add the sausage, pepper, onion and paprika. Break the sausage up with a spoon and cook 8 minutes until browned and 165\u00b0F inside.","Use the spoon to make 4 small wells in the mixture. Crack an egg into each and season with salt and pepper.","Cover the skillet and cook 4 to 5 minutes over medium-low heat until the whites are set and the yolks are as firm as you like. Serve straight from the pan."],"tp":{"1":"Leave the potatoes alone for the first 3 to 4 minutes so they brown instead of sticking.","3":"Make each well with the back of a spoon so the egg stays in place."},"store":"Fridge 4 days. Reheat in a skillet.","kcal":385,"p":26,"f":17,"c":32,"tags":["protein25"]},{"n":8,"t":"Spinach Cheddar Frittata","ch":"1 Easy Mornings","sv":6,"pr":10,"ck":22,"ing":[["egg whole raw",600],["spinach raw",150],["cheddar cheese",150],["greek yogurt plain nonfat",120],["yellow onion raw",80],["olive oil",15]],"st":["Heat the oven to 400\u00b0F. Chop the onion. Roughly chop the spinach.","In a 10-inch oven-safe skillet, heat the oil over medium heat. Cook the onion 4 minutes until soft, then add the spinach and stir 1 to 2 minutes until wilted.","Whisk the eggs, yogurt, 1/2 teaspoon salt and 1/4 teaspoon pepper until smooth.","Pour the eggs over the vegetables and scatter the cheddar on top. Cook on the stove 2 minutes until the edges begin to set.","Transfer the skillet to the oven and bake 12 to 15 minutes, until the center is set and the top is lightly golden.","Rest 5 minutes, then cut into 6 wedges. Use oven mitts: the handle stays hot."],"tp":{"1":"Wilt the spinach fully and drain any liquid. Extra water makes a watery frittata.","4":"If your skillet is not oven-safe, move the egg mixture to a greased baking dish before baking."},"store":"Fridge 4 days. Freezer 2 months.","kcal":289,"p":21,"f":21,"c":4,"tags":["freezer"]},{"n":9,"t":"Bacon, Egg and Cheese Breakfast Bake","ch":"1 Easy Mornings","sv":8,"pr":15,"ck":45,"ing":[["white bread",250],["egg whole raw",500],["bacon cooked",150],["cheddar cheese",180],["milk 2%",360]],"st":["Heat the oven to 350\u00b0F and grease a 9x13-inch baking dish. Cut the bread into 1-inch cubes.","Spread the bread in the dish and scatter the crumbled bacon and cheddar over it.","Whisk the eggs and milk with 1/2 teaspoon salt and 1/4 teaspoon pepper until smooth. Pour evenly over the bread.","Press the bread down gently so it soaks up the egg. Let it rest 10 minutes, or cover and chill overnight.","Bake 35 to 40 minutes, until puffed, golden and a knife in the center comes out clean.","Rest 5 minutes before cutting into 8 squares."],"tp":{"3":"Resting lets the bread soak up the egg. Overnight in the fridge gives the best texture.","4":"The center should look set and a knife should come out clean."},"store":"Fridge 5 days. Freezer 2 months.","kcal":388,"p":24,"f":23,"c":19,"tags":["freezer"]},{"n":10,"t":"Soft Scrambled Eggs with Cottage Cheese on Toast","ch":"1 Easy Mornings","sv":4,"pr":5,"ck":10,"ing":[["egg whole raw",400],["cottage cheese lowfat 2%",225],["whole wheat bread",160],["butter",20],["chives fresh",8]],"st":["Toast the bread and slice the chives. Beat the eggs well with a pinch of salt and pepper, then stir in the cottage cheese.","Melt the butter in a nonstick skillet over low heat. Do not let it brown.","Pour in the egg mixture. Let it sit 20 seconds, then stir slowly with a spatula, pulling the eggs across the pan in soft folds.","Cook 4 to 6 minutes. Take the pan off the heat while the eggs still look slightly wet, since they finish cooking on the way to the plate.","Spoon over the toast and top with chives."],"tp":{"2":"Pull the spatula across the pan slowly, so you get large soft curds instead of small crumbs.","3":"The eggs keep cooking after you plate them, so stop while they look a little glossy."},"store":"Best fresh. Fridge 2 days.","kcal":326,"p":24,"f":16,"c":21,"tags":["quick"]},{"n":11,"t":"Banana Oat Pancakes","ch":"1 Easy Mornings","sv":4,"pr":10,"ck":15,"ing":[["banana raw",236],["rolled oats",100],["egg whole raw",200],["greek yogurt plain nonfat",120],["baking powder",6],["milk 2%",60],["cinnamon ground",2],["vanilla extract",4],["butter",14],["cottage cheese lowfat 2%",225]],"st":["Add the banana, oats, eggs, cottage cheese, yogurt, milk, baking powder, cinnamon and vanilla to a blender.","Blend 30 to 45 seconds until smooth, scraping down the sides once. Let the batter rest 5 minutes so the oats soften.","Heat a nonstick pan over medium-low heat and rub it lightly with a little of the butter.","Pour 1/4 cup batter per pancake and cook 2 to 3 minutes, until bubbles form and the edges look set.","Flip and cook 2 minutes more until golden. Wipe the pan with more butter between batches and keep the finished pancakes warm in a 200\u00b0F oven.","Serve warm with fruit or a drizzle of syrup."],"tp":{"1":"Resting the batter lets the oats absorb liquid, so the pancakes are not gummy.","3":"Flip when the bubbles on top pop and the edges look dry."},"store":"Fridge 4 days. Freezer 2 months.","kcal":322,"p":21,"f":11,"c":36,"tags":["freezer"]},{"n":12,"t":"Black Bean Breakfast Quesadilla","ch":"1 Easy Mornings","sv":4,"pr":10,"ck":15,"ing":[["flour tortilla 10 inch",256],["egg whole raw",300],["black beans canned",200],["cheddar cheese",120],["salsa",80],["olive oil",10]],"st":["Drain and rinse the beans. Beat the eggs with a pinch of salt and pepper.","Heat the oil in a nonstick skillet over medium heat. Add the eggs and stir gently 2 to 3 minutes until just set. Move to a plate.","Lay the 4 tortillas out. On half of each, layer the eggs, beans, cheddar and salsa.","Fold each tortilla over the filling to make a half-moon and press down lightly.","Wipe the skillet. Toast the quesadillas over medium heat 2 minutes per side, until golden and the cheese is melted.","Let them cool 1 minute, then cut each into wedges."],"tp":{"1":"Use low to medium heat so the eggs stay soft and the tortilla does not burn.","4":"Press the quesadilla gently with a spatula as it toasts so the cheese melts evenly."},"store":"Fridge 4 days. Reheat in a skillet.","kcal":497,"p":25,"f":25,"c":43,"tags":[]},{"n":13,"t":"Lightened Biscuits and Sausage Gravy","ch":"1 Easy Mornings","sv":6,"pr":15,"ck":35,"ing":[["all-purpose flour",280],["greek yogurt plain nonfat",250],["baking powder",12],["butter",56],["milk 2%",540],["turkey breakfast sausage raw",450]],"st":["Heat the oven to 425\u00b0F and line a baking sheet with parchment. Cube the cold butter.","For the biscuits, whisk 250 g flour and the baking powder. Rub in the butter with your fingertips until pea-size crumbs remain.","Stir in the yogurt with a fork until a shaggy dough forms. Drop 6 mounds onto the sheet and bake 15 minutes until golden.","Meanwhile, brown the sausage in a large skillet over medium heat 6 to 8 minutes, breaking it up, until cooked through and 165\u00b0F.","Sprinkle the remaining 30 g flour over the sausage and stir 1 minute. Slowly whisk in the milk.","Simmer 5 to 6 minutes, stirring, until thick enough to coat a spoon. Season generously with pepper and a little salt.","Split the warm biscuits and spoon the gravy over the top."],"tp":{"1":"Keep the butter cold. Cold butter makes tender, flaky biscuits.","5":"Whisk constantly while adding the milk so the gravy has no lumps."},"store":"Fridge 3 days. Reheat gravy with a splash of milk.","kcal":424,"p":26,"f":16,"c":42,"tags":["protein25"]},{"n":14,"t":"Berry Yogurt Parfait Cups","ch":"1 Easy Mornings","sv":4,"pr":10,"ck":0,"ing":[["greek yogurt plain nonfat",800],["blueberries raw",200],["strawberries raw",200],["granola",120],["honey",40]],"st":["Rinse and dry the berries. Slice the strawberries.","Spoon about 1/3 cup yogurt into each of 4 cups or jars.","Add a layer of mixed berries, then drizzle with a little honey.","Repeat with a second layer of yogurt, berries and honey.","Top with granola just before serving so it stays crunchy."],"tp":{"4":"Add the granola right before eating so it stays crunchy."},"store":"Fridge 3 days, granola added the same day.","kcal":340,"p":25,"f":8,"c":43,"tags":["quick","protein25"]},{"n":15,"t":"Chicken Salad Sandwiches with Yogurt Dressing","ch":"2 Lunches from the Pantry","sv":4,"pr":15,"ck":20,"ing":[["chicken breast raw",500],["greek yogurt plain nonfat",180],["celery raw",80],["lemon juice",15],["dijon mustard",10],["whole wheat bread",320]],"st":["Cook the chicken: poach in simmering salted water 12 to 15 minutes, or bake at 400\u00b0F 20 minutes, until 165\u00b0F inside. Cool 10 minutes.","Chop the chicken into small pieces. Dice the celery finely.","In a bowl, mix the yogurt, lemon juice and mustard. Season with 1/4 teaspoon salt and pepper.","Fold in the chicken and celery until evenly coated. Taste and adjust the seasoning.","Toast the bread if you like. Pile the chicken salad onto 4 slices and top with the rest."],"tp":{"0":"Do not boil the chicken hard. A gentle simmer keeps it tender.","2":"Mix the dressing first and taste it before adding the chicken."},"store":"Fridge 4 days. Keep bread separate.","kcal":383,"p":43,"f":6,"c":37,"tags":["protein25"]},{"n":16,"t":"Tuna Melts on Toast","ch":"2 Lunches from the Pantry","sv":4,"pr":10,"ck":10,"ing":[["tuna canned in water drained",360],["greek yogurt plain nonfat",90],["dill pickles",60],["celery raw",40],["cheddar cheese",120],["whole wheat bread",320]],"st":["Heat the broiler with a rack in the upper third of the oven. Toast the bread on a baking sheet 1 to 2 minutes per side.","Drain the tuna well. Chop the pickles and celery.","Mix the tuna, yogurt, pickles and celery. Season with pepper.","Spread the tuna mix over the toast and top with the cheddar.","Broil 3 to 4 minutes, watching closely, until the cheese is bubbly and lightly browned. Serve hot."],"tp":{"0":"Keep the rack in the upper third so the cheese browns before the bread burns.","4":"Watch the tuna melts the whole time. The broiler works fast."},"store":"Best fresh. Tuna mix keeps 3 days.","kcal":416,"p":37,"f":14,"c":37,"tags":["quick","protein25"]},{"n":17,"t":"Turkey and Cheese Pinwheels","ch":"2 Lunches from the Pantry","sv":6,"pr":15,"ck":0,"ing":[["flour tortilla 10 inch",384],["turkey breast deli sliced",400],["cheddar cheese",180],["spinach raw",90],["greek yogurt plain nonfat",100],["dijon mustard",20]],"st":["Lay the 6 tortillas flat. Mix the yogurt and mustard and spread it in a thin layer over each tortilla, leaving a 1-inch edge.","Cover with a layer of turkey slices, then cheddar, then a handful of spinach.","Roll each tortilla up tightly, tucking in the filling as you go.","Wrap the rolls in plastic wrap or foil and chill 30 minutes so they hold their shape.","Trim the ends and slice each roll into 1-inch pinwheels with a sharp knife."],"tp":{"0":"Leave a 1-inch edge clean so the tortillas seal when you roll them.","3":"Chilling firms up the filling, which makes clean slices."},"store":"Fridge 4 days.","kcal":403,"p":24,"f":18,"c":35,"tags":["quick"]},{"n":18,"t":"Black Bean and Corn Quesadillas","ch":"2 Lunches from the Pantry","sv":4,"pr":10,"ck":15,"ing":[["flour tortilla 10 inch",256],["black beans canned",350],["corn sweet canned",150],["cheddar cheese",220],["salsa",120],["cilantro fresh",10],["olive oil",10]],"st":["Drain and rinse the beans and corn. Chop the cilantro.","Mash half the beans with a fork. Stir in the whole beans, corn and cilantro.","Lay out the 4 tortillas. Spread the filling on half of each and top with the cheddar.","Fold over and press down gently.","Heat the oil in a large skillet over medium heat. Toast the quesadillas 2 to 3 minutes per side until golden and the cheese melts.","Cut into wedges and serve with salsa."],"tp":{"1":"Mashing half the beans makes the filling hold together.","4":"Toast over medium heat. If the pan is too hot the outside burns before the cheese melts."},"store":"Fridge 4 days. Freezer 2 months.","kcal":554,"p":24,"f":27,"c":55,"tags":["freezer"]},{"n":19,"t":"Egg Salad Lettuce Wraps","ch":"2 Lunches from the Pantry","sv":4,"pr":15,"ck":12,"ing":[["egg whole raw",600],["greek yogurt plain nonfat",120],["dijon mustard",15],["celery raw",60],["lettuce romaine raw",200],["paprika",2],["chives fresh",8]],"st":["Place the eggs in a pot and cover with cold water by 1 inch. Bring to a boil, cover, turn off the heat and let stand 10 minutes.","Move the eggs to a bowl of ice water for 5 minutes, then peel and chop.","Dice the celery and slice the chives.","Mix the yogurt, mustard, celery and chives, then fold in the eggs. Season with salt and pepper.","Spoon into the romaine leaves and dust with paprika."],"tp":{"0":"Letting the eggs stand in hot water (not boiling) keeps the yolks creamy and avoids a green ring.","1":"Cooling the eggs in ice water makes them easier to peel."},"store":"Fridge 3 days. Keep lettuce separate.","kcal":247,"p":23,"f":15,"c":5,"tags":[]},{"n":20,"t":"Easy BBQ Chicken Sandwiches","ch":"2 Lunches from the Pantry","sv":6,"pr":10,"ck":240,"ing":[["chicken breast raw",900],["bbq sauce",180],["chicken broth",120],["yellow onion raw",100],["hamburger bun",342]],"st":["Slice the onion and place it in the bottom of a slow cooker. Add the chicken breasts and the broth.","Cover and cook on low 6 hours, until the chicken is tender and shreds easily with two forks.","Drain off most of the liquid, leaving about 1/4 cup, and shred the chicken.","Stir in the BBQ sauce. Cover and cook on high 15 minutes so it heats through.","Toast the buns lightly and pile the chicken onto them."],"tp":{"1":"Keep the lid on. Each time you open it, the slow cooker loses heat.","2":"Leave a little cooking liquid with the shredded chicken so it stays juicy."},"store":"Fridge 5 days. Freezer 3 months.","kcal":395,"p":39,"f":7,"c":43,"tags":["freezer","protein25"]},{"n":21,"t":"Turkey Taco Salad Jars","ch":"2 Lunches from the Pantry","sv":4,"pr":15,"ck":15,"ing":[["ground turkey 93% raw",500],["black beans canned",250],["corn sweet canned",150],["salsa",200],["lettuce romaine raw",200],["cheddar cheese",80],["greek yogurt plain nonfat",120],["chili powder",8],["cumin ground",3],["olive oil",10],["cherry tomatoes raw",100]],"st":["Drain and rinse the beans and corn. Halve the tomatoes and chop the lettuce.","Heat the oil in a large skillet over medium-high heat. Brown the turkey 6 to 8 minutes, breaking it up, until no pink remains and 165\u00b0F inside.","Stir in the chili powder, cumin, 1/2 teaspoon salt and a splash of water and cook 1 minute. Cool 5 minutes.","In 4 large jars, layer salsa, beans, corn and turkey.","Top with lettuce, tomatoes and cheddar. Keep the yogurt on the side or add it on top.","Chill, or eat right away. Shake or tip into a bowl to serve."],"tp":{"1":"Break the turkey into small crumbles so it browns evenly.","3":"Put the wet ingredients (salsa) at the bottom so the lettuce stays crisp."},"store":"Fridge 4 days. Add lettuce and yogurt at serving.","kcal":426,"p":38,"f":21,"c":25,"tags":["protein25"]},{"n":22,"t":"Chickpea Tuna Salad Bowls","ch":"2 Lunches from the Pantry","sv":4,"pr":15,"ck":0,"ing":[["tuna canned in water drained",300],["chickpeas canned",480],["cucumber raw",200],["cherry tomatoes raw",200],["red onion raw",60],["lemon juice",45],["olive oil",30],["parsley fresh",10],["feta cheese",60]],"st":["Drain and rinse the chickpeas. Drain the tuna well. Dice the cucumber and red onion, halve the tomatoes and chop the parsley.","Whisk the lemon juice, olive oil, 1/4 teaspoon salt and pepper in a large bowl.","Add the tuna, chickpeas, cucumber, tomatoes, onion and parsley and toss gently so the tuna flakes but does not turn to mush.","Divide among 4 bowls.","Crumble the feta on top. Serve right away or chill up to 30 minutes."],"tp":{"0":"Pat the cucumber and tomatoes dry so the salad is not watery.","2":"Toss gently so the tuna flakes but does not turn mushy."},"store":"Fridge 3 days.","kcal":363,"p":26,"f":15,"c":34,"tags":["quick","protein25"]},{"n":23,"t":"Cheesy Broccoli Potato Soup","ch":"2 Lunches from the Pantry","sv":6,"pr":15,"ck":30,"ing":[["potato raw",500],["broccoli raw",400],["cheddar cheese",220],["greek yogurt plain nonfat",250],["milk 2%",360],["chicken broth",480],["yellow onion raw",120],["garlic raw",9],["butter",28],["all-purpose flour",30]],"st":["Dice the potato into 1/2-inch cubes. Chop the broccoli into small florets. Finely chop the onion and garlic.","In a large pot, melt the butter over medium heat. Cook the onion 4 minutes, add the garlic for 30 seconds, then stir in the flour for 1 minute.","Slowly whisk in the broth and milk. Add the potato and simmer 12 minutes, until almost tender.","Add the broccoli and simmer 6 minutes more.","Blend about half of the soup with an immersion blender, leaving some chunks for texture.","Take the pot off the heat. Stir in the cheddar until melted, then the yogurt. Do not boil after the yogurt goes in.","Season with salt and pepper and serve hot."],"tp":{"2":"Cut the potatoes small so they cook in the same time as the broccoli.","5":"Do not boil after adding the yogurt, or it can curdle."},"store":"Fridge 4 days. Freezer 2 months without the yogurt.","kcal":356,"p":20,"f":18,"c":31,"tags":["freezer"]},{"n":24,"t":"Classic Chicken Noodle Soup","ch":"2 Lunches from the Pantry","sv":6,"pr":15,"ck":35,"ing":[["chicken breast raw",600],["egg noodles dry",180],["carrot raw",200],["celery raw",150],["yellow onion raw",150],["garlic raw",9],["chicken broth",1400],["parsley fresh",10],["olive oil",15],["thyme dried",2]],"st":["Dice the onion, carrot and celery. Mince the garlic.","In a large pot, heat the oil over medium heat. Cook the vegetables 5 minutes, add the garlic for 30 seconds.","Add the broth, thyme and whole chicken breasts. Bring to a boil, then simmer gently 18 minutes until the chicken is 165\u00b0F.","Move the chicken to a plate and shred it with two forks.","Return the pot to a boil and add the noodles. Cook 6 to 8 minutes until tender.","Stir the chicken back in, season with salt and pepper and top with parsley."],"tp":{"2":"Keep the broth at a gentle simmer so the chicken stays tender.","4":"Cook the noodles until just tender. They keep softening in the hot soup."},"store":"Fridge 4 days. Freezer 2 months without the noodles.","kcal":302,"p":29,"f":7,"c":29,"tags":["freezer","protein25"]},{"n":25,"t":"Lentil Sloppy Joes","ch":"2 Lunches from the Pantry","sv":6,"pr":15,"ck":40,"ing":[["lentils dry",160],["ground turkey 93% raw",450],["tomato sauce canned",240],["yellow onion raw",150],["bell pepper red raw",100],["ketchup",60],["worcestershire sauce",15],["chili powder",6],["brown sugar",15],["hamburger bun",342],["chicken broth",360]],"st":["Dice the onion and pepper. Rinse the lentils.","In a large skillet or pot, brown the turkey with the onion and pepper over medium-high heat 6 to 8 minutes, until 165\u00b0F.","Stir in the lentils, broth, tomato sauce, ketchup, Worcestershire, chili powder and sugar.","Bring to a boil, then cover and simmer on low 25 to 30 minutes, stirring now and then, until the lentils are tender. Add a splash of water if it gets dry.","Uncover for the last 5 minutes if it is too thin.","Toast the buns and spoon the mixture over the bottom halves."],"tp":{"2":"Rinse the lentils first. They do not need soaking.","3":"If the mixture is too thick, add a splash of water. If it is too thin, cook it uncovered."},"store":"Fridge 5 days. Freezer 3 months.","kcal":414,"p":27,"f":9,"c":58,"tags":["freezer","protein25"]},{"n":26,"t":"Chicken Caesar Wraps with Yogurt Dressing","ch":"2 Lunches from the Pantry","sv":4,"pr":15,"ck":15,"ing":[["chicken breast raw",500],["flour tortilla 10 inch",256],["lettuce romaine raw",150],["parmesan grated",40],["greek yogurt plain nonfat",120],["lemon juice",20],["garlic raw",3],["dijon mustard",5],["anchovy paste",5],["olive oil",15]],"st":["Season the chicken with salt and pepper. Cook in a skillet with the oil over medium-high heat 6 to 7 minutes per side, until 165\u00b0F inside. Rest 5 minutes, then slice.","Whisk the yogurt, lemon juice, grated garlic, mustard, anchovy paste and half the parmesan until smooth.","Chop the romaine. Toss it with the chicken and about two thirds of the dressing.","Warm the tortillas 15 seconds in the microwave so they roll without cracking.","Spoon the chicken salad onto each tortilla, top with the remaining parmesan and fold in the sides.","Roll tightly and cut in half. Serve with the rest of the dressing."],"tp":{"0":"Rest the chicken 5 minutes before slicing so the juices stay inside.","4":"Warm tortillas are flexible and will not crack when you roll."},"store":"Fridge 3 days.","kcal":451,"p":40,"f":15,"c":36,"tags":["protein25"]},{"n":27,"t":"Creamy Tomato Soup with Grilled Cheese Dippers","ch":"2 Lunches from the Pantry","sv":4,"pr":10,"ck":30,"ing":[["diced tomatoes canned",800],["yellow onion raw",120],["garlic raw",9],["milk 2%",240],["chicken broth",240],["olive oil",15],["greek yogurt plain nonfat",200],["white bread",240],["cheddar cheese",180],["butter",28]],"st":["Chop the onion and mince the garlic.","In a large pot, heat the oil over medium heat. Cook the onion 5 minutes, then add the garlic for 30 seconds.","Add the tomatoes and broth and simmer 15 minutes. Blend until smooth.","Stir in the milk, then take the pot off the heat and stir in the yogurt. Season with salt and pepper.","Butter one side of each slice of bread. Place cheddar between 2 slices, buttered sides out, to make 2 sandwiches per person.","Toast in a skillet over medium-low heat 3 minutes per side, until golden and melted.","Cut into strips for dipping and serve with the hot soup."],"tp":{"2":"Blend carefully. Hot soup expands, so fill the blender only halfway and hold the lid down with a towel.","5":"Toast the sandwiches on low-medium heat so the cheese melts before the bread browns."},"store":"Soup keeps 4 days. Freezer 2 months without the yogurt.","kcal":535,"p":25,"f":28,"c":47,"tags":["freezer","protein25"]},{"n":28,"t":"Rice and Bean Burrito Bowls","ch":"2 Lunches from the Pantry","sv":4,"pr":10,"ck":25,"ing":[["white rice long grain raw",180],["black beans canned",450],["corn sweet canned",150],["cheddar cheese",150],["salsa",160],["greek yogurt plain nonfat",200],["avocado raw",150],["lime juice",30],["cilantro fresh",10],["cumin ground",3]],"st":["Cook the rice according to the package. Drain and rinse the beans and corn. Chop the cilantro and cube the avocado.","Warm the beans with the cumin and a splash of water in a small pot 5 minutes.","Divide the rice among 4 bowls.","Arrange the beans, corn and salsa on top.","Add the cheddar, avocado and a spoonful of yogurt. Squeeze the lime juice over the top.","Finish with cilantro."],"tp":{"3":"Warm the beans with a splash of water so they stay creamy.","4":"Add the avocado last so it does not turn brown."},"store":"Fridge 4 days. Add avocado and yogurt fresh.","kcal":549,"p":26,"f":20,"c":70,"tags":["protein25"]},{"n":29,"t":"Garlic Butter Chicken and Potatoes","ch":"3 One-Pan Dinners","sv":4,"pr":10,"ck":35,"ing":[["chicken breast raw",700],["potato raw",600],["butter",42],["garlic raw",12],["olive oil",15],["parsley fresh",10],["paprika",4],["lemon juice",15]],"st":["Cut the chicken and potatoes into 3/4-inch pieces. Toss with the paprika, 1 teaspoon salt and 1/2 teaspoon pepper.","Heat the oil in a large skillet over medium-high heat. Cook the potatoes in one layer 10 minutes, turning, until golden.","Push the potatoes aside, add the chicken and cook 8 minutes, stirring now and then.","Reduce the heat to medium. Add the butter, minced garlic and lemon juice and stir to coat.","Cover and cook 6 minutes until the chicken is 165\u00b0F and the potatoes are tender.","Top with parsley and serve from the pan."],"tp":{"1":"Do not stir the potatoes too often. Let them brown on one side first.","4":"The chicken must reach 165\u00b0F in the thickest part."},"store":"Fridge 4 days. Freezer 2 months.","kcal":443,"p":43,"f":17,"c":28,"tags":["freezer","protein25"]},{"n":30,"t":"Ground Beef and Rice Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":35,"ing":[["ground beef 90% raw",700],["white rice long grain raw",200],["yellow onion raw",150],["garlic raw",9],["diced tomatoes canned",400],["beef broth",480],["cheddar cheese",120],["worcestershire sauce",15],["olive oil",10]],"st":["Dice the onion and mince the garlic.","In a large deep skillet, brown the beef and onion over medium-high heat 8 minutes, breaking it up. Drain off the excess fat.","Add the garlic, tomatoes, broth, Worcestershire and rice. Stir and bring to a boil.","Cover, reduce the heat to low and simmer 18 to 20 minutes, without lifting the lid, until the rice is tender.","Sprinkle with the cheddar, cover and cook 2 minutes until melted. Fluff and serve."],"tp":{"1":"Drain the fat before adding the rice, or the skillet will be greasy.","3":"Do not lift the lid while the rice cooks, so the steam stays inside."},"store":"Fridge 5 days. Freezer 3 months.","kcal":458,"p":33,"f":20,"c":34,"tags":["freezer","protein25"]},{"n":31,"t":"Chicken Alfredo Skillet with a Yogurt Twist","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":30,"ing":[["chicken breast raw",700],["penne pasta dry",300],["chicken broth",480],["milk 2%",360],["parmesan grated",90],["greek yogurt plain nonfat",150],["garlic raw",12],["butter",28],["parsley fresh",8]],"st":["Cut the chicken into 1-inch pieces and season with salt and pepper. Mince the garlic.","Melt the butter in a large deep skillet over medium-high heat. Sear the chicken 5 minutes, turning, until golden.","Add the garlic for 30 seconds, then the broth, milk and dry penne. Stir and bring to a simmer.","Reduce the heat to medium-low and cook 12 to 14 minutes, stirring often, until the pasta is tender and the chicken is 165\u00b0F. The sauce will thicken.","Take the pan off the heat. Stir in the parmesan, then the yogurt.","Top with parsley. If the sauce is too thick, loosen it with a splash of milk."],"tp":{"1":"Cut the chicken into even pieces so it cooks at the same speed.","3":"Stir often so the pasta does not stick. If the sauce looks dry, add a splash of milk or broth.","4":"Adding yogurt off the heat keeps the sauce creamy and smooth."},"store":"Fridge 4 days. Add a splash of milk when reheating.","kcal":475,"p":42,"f":13,"c":44,"tags":["protein25"]},{"n":32,"t":"Turkey Taco Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":25,"ing":[["ground turkey 93% raw",700],["black beans canned",250],["taco seasoning",30],["yellow onion raw",150],["diced tomatoes canned",400],["chicken broth",240],["cheddar cheese",120],["greek yogurt plain nonfat",120],["olive oil",10]],"st":["Dice the onion. Drain and rinse the beans.","Heat the oil in a large skillet over medium-high heat. Brown the turkey and onion 6 to 8 minutes, breaking it up, until 165\u00b0F.","Stir in the taco seasoning and cook 1 minute.","Add the tomatoes, beans and broth. Simmer 12 minutes, stirring now and then, until slightly thickened.","Top with the cheddar and cover 2 minutes. Serve with a spoonful of yogurt."],"tp":{"1":"Break the turkey into small crumbles. Brown it well for more flavor.","3":"Simmer until most of the liquid is gone, so the skillet is saucy but not soupy."},"store":"Fridge 5 days. Freezer 3 months.","kcal":353,"p":32,"f":19,"c":16,"tags":["freezer","protein25"]},{"n":33,"t":"Sausage, Peppers and Onions Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":25,"ing":[["chicken sausage precooked",600],["bell pepper red raw",450],["yellow onion raw",250],["olive oil",20],["garlic raw",9],["italian seasoning",3],["cheddar cheese",90]],"st":["Slice the sausage into coins and the peppers and onion into strips. Mince the garlic.","Heat the oil in a large skillet over medium-high heat. Brown the sausage 5 minutes and move it to a plate.","Add the peppers and onion to the same pan with the Italian seasoning. Cook 10 to 12 minutes, stirring, until tender and lightly browned.","Add the garlic for 30 seconds, then return the sausage and heat through.","Sprinkle with the cheddar, cover 1 to 2 minutes until melted."],"tp":{"0":"Cut the vegetables the same size so they cook evenly.","2":"Let the peppers brown a little at the edges for sweeter flavor."},"store":"Fridge 4 days. Freezer 2 months.","kcal":313,"p":26,"f":13,"c":24,"tags":["freezer","protein25"]},{"n":34,"t":"Lemon Garlic Shrimp and Rice","ch":"3 One-Pan Dinners","sv":4,"pr":10,"ck":25,"ing":[["shrimp raw",600],["white rice long grain raw",200],["butter",28],["garlic raw",15],["lemon juice",45],["chicken broth",480],["parsley fresh",10],["paprika",3]],"st":["Cook the rice in the broth: bring to a boil, add the rice, cover and simmer on low about 18 minutes. Rest 5 minutes.","Pat the shrimp dry and toss with the paprika, 1/2 teaspoon salt and pepper. Mince the garlic.","Melt the butter in a large skillet over medium-high heat. Add the garlic for 30 seconds.","Add the shrimp in one layer and cook 2 to 3 minutes per side, until pink and curled into a loose C.","Pour in the lemon juice and toss for 30 seconds.","Spoon over the rice and top with parsley."],"tp":{"1":"Pat the shrimp very dry. They brown better.","3":"Shrimp are done when they turn pink and curl into a loose C. Overcooked shrimp curl into a tight O and turn rubbery."},"store":"Fridge 2 days. Reheat gently.","kcal":357,"p":25,"f":8,"c":44,"tags":["protein25"]},{"n":35,"t":"Beef and Broccoli Skillet","ch":"3 One-Pan Dinners","sv":4,"pr":15,"ck":20,"ing":[["beef flank steak raw",600],["broccoli raw",450],["soy sauce",45],["garlic raw",12],["ginger root raw",8],["cornstarch",12],["brown sugar",20],["vegetable oil",20],["white rice long grain raw",180]],"st":["Cook the rice. Slice the flank steak thinly against the grain and toss with the cornstarch. Cut the broccoli into small florets. Mince the garlic and ginger.","Mix the soy sauce, brown sugar and 2 tablespoons water in a small bowl.","Heat half the oil in a large skillet over high heat. Stir-fry the beef in one layer 2 to 3 minutes until browned, then move it to a plate.","Add the remaining oil, the garlic and ginger and stir 15 seconds.","Add the broccoli and a splash of water, cover and cook 3 to 4 minutes until bright green and tender-crisp.","Return the beef, pour in the sauce and simmer 1 to 2 minutes until glossy.","Serve over the rice."],"tp":{"0":"Slicing against the grain makes the beef tender.","2":"Cook the beef in one layer over high heat. Do it in two batches if the pan is crowded.","4":"The splash of water steams the broccoli so it cooks fast and stays bright green."},"store":"Fridge 4 days. Freezer 2 months.","kcal":522,"p":39,"f":17,"c":53,"tags":["freezer","protein25"]},{"n":36,"t":"One-Pot Chili Mac","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":30,"ing":[["ground beef 90% raw",600],["elbow macaroni dry",300],["kidney beans canned",250],["diced tomatoes canned",800],["yellow onion raw",150],["chili powder",20],["cumin ground",5],["garlic raw",12],["cheddar cheese",150],["beef broth",360]],"st":["Dice the onion and mince the garlic.","In a large, deep pot, brown the beef and onion over medium-high heat 8 minutes, breaking it up. Drain the excess fat.","Add the garlic, chili powder and cumin and stir 1 minute until fragrant.","Stir in the tomatoes with their juice, the drained kidney beans, broth and the dry macaroni. Bring to a boil.","Reduce to a simmer, cover and cook 15 to 18 minutes, stirring every 5 minutes, until the macaroni is tender.","Stir in half the cheddar until melted and top with the rest. Cover 2 minutes."],"tp":{"3":"Use a pot big enough for the pasta to move. Stir every 5 minutes.","5":"Stir in half the cheese off the heat so it melts smooth."},"store":"Fridge 5 days. Freezer 3 months.","kcal":552,"p":38,"f":20,"c":55,"tags":["freezer","protein25"]},{"n":37,"t":"Chicken Fajita Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":22,"ing":[["chicken breast raw",800],["bell pepper red raw",450],["yellow onion raw",200],["olive oil",30],["chili powder",15],["cumin ground",4],["lime juice",30],["flour tortilla 10 inch",384],["greek yogurt plain nonfat",150],["cheddar cheese",90]],"st":["Slice the chicken, peppers and onion into thin strips, about 1/2 inch wide.","Toss with the oil, chili powder, cumin and 1 teaspoon salt in a large bowl.","Heat a large skillet over medium-high heat. Cook half the mixture in one layer 5 to 6 minutes, stirring now and then. Repeat with the rest, so it browns rather than steams.","Cook until the chicken reaches 165\u00b0F and the vegetables are tender with charred edges. Squeeze in the lime juice.","Warm the tortillas in a dry skillet or the microwave.","Serve the filling in the tortillas with yogurt and cheddar."],"tp":{"2":"Do not crowd the pan. Cook in two batches so the chicken and vegetables brown instead of steam.","3":"Chicken is done at 165\u00b0F. The vegetables should be tender with a few charred edges."},"store":"Fridge 4 days.","kcal":519,"p":43,"f":19,"c":43,"tags":["protein25"]},{"n":38,"t":"Cheesy Beef Taco Pasta","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":25,"ing":[["ground beef 90% raw",600],["rotini pasta dry",300],["taco seasoning",30],["diced tomatoes canned",400],["beef broth",480],["cheddar cheese",180],["yellow onion raw",120],["greek yogurt plain nonfat",120]],"st":["Dice the onion.","In a large deep skillet, brown the beef and onion over medium-high heat 8 minutes, breaking it up. Drain the fat.","Stir in the taco seasoning and cook 1 minute.","Add the tomatoes, broth and dry rotini. Bring to a boil, then reduce to a simmer, cover and cook 12 to 14 minutes, stirring now and then, until the pasta is tender.","Stir in the cheddar until melted. The sauce thickens as it stands.","Top with spoonfuls of yogurt."],"tp":{"1":"Drain the beef fat so the sauce is not oily.","3":"Stir now and then to stop the pasta from sticking to the bottom."},"store":"Fridge 5 days. Freezer 3 months.","kcal":533,"p":38,"f":21,"c":47,"tags":["freezer","protein25"]},{"n":39,"t":"Honey Garlic Chicken Thighs","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":35,"ing":[["chicken thigh meat and skin raw",1100],["honey",80],["soy sauce",60],["garlic raw",15],["rice vinegar",15],["cornstarch",8],["vegetable oil",15],["sesame seeds",6]],"st":["Pat the thighs dry and season with 1/2 teaspoon salt and pepper. Mince the garlic.","Heat the oil in a large oven-safe or deep skillet over medium-high heat. Sear the thighs skin side down 6 minutes until deep golden, then flip and cook 5 minutes.","Whisk the honey, soy sauce, garlic, vinegar, cornstarch and 2 tablespoons water.","Pour the sauce around the chicken. Bring to a simmer, cover and cook on medium-low 12 to 15 minutes, until 175\u00b0F in the thickest part.","Uncover and spoon the sauce over the chicken for 2 minutes until glossy.","Sprinkle with the sesame seeds."],"tp":{"1":"Do not move the thighs while they sear. They release from the pan when the skin is crisp.","3":"Check the temperature in the thickest part, away from the bone: 175\u00b0F for tender thighs."},"store":"Fridge 4 days. Freezer 3 months.","kcal":488,"p":31,"f":34,"c":14,"tags":["freezer","protein25"]},{"n":40,"t":"Sun-Dried Tomato Garlic Chicken","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":25,"ing":[["chicken breast raw",900],["sun-dried tomatoes",80],["garlic raw",15],["parmesan grated",50],["olive oil",30],["chicken broth",180],["spinach raw",100],["greek yogurt plain nonfat",120],["italian seasoning",3]],"st":["Season the chicken with salt and pepper. Chop the sun-dried tomatoes, mince the garlic and chop the spinach.","Heat half the oil in a large skillet over medium-high heat. Sear the chicken 5 minutes per side until golden. Move it to a plate.","Add the remaining oil, garlic and tomatoes and cook 1 minute. Pour in the broth and Italian seasoning and simmer 3 minutes.","Stir in the spinach until wilted, then the parmesan.","Return the chicken and any juices to the pan. Simmer 5 minutes until 165\u00b0F inside.","Take the pan off the heat and stir the yogurt into the sauce. Spoon over the chicken."],"tp":{"1":"Sear without moving until the chicken releases from the pan.","5":"Stir the yogurt into the sauce off the heat so it does not curdle."},"store":"Fridge 4 days.","kcal":316,"p":41,"f":12,"c":11,"tags":["protein25"]},{"n":41,"t":"Pork Chops with Apples and Onions","ch":"3 One-Pan Dinners","sv":4,"pr":10,"ck":25,"ing":[["pork loin chops raw",700],["apple raw",360],["yellow onion raw",200],["butter",28],["apple cider vinegar",15],["chicken broth",120],["thyme dried",2]],"st":["Pat the chops dry and season with salt and pepper. Slice the apples and onion.","Melt half the butter in a large skillet over medium-high heat. Sear the chops 4 minutes per side until golden. Move them to a plate.","Add the remaining butter, apples and onion to the pan. Cook 8 minutes, stirring, until soft and lightly browned.","Add the vinegar, broth and thyme and scrape up the browned bits.","Return the chops to the pan, spoon the apples over and simmer 5 minutes until the chops reach 145\u00b0F.","Rest 3 minutes before serving."],"tp":{"1":"A golden crust on the chops means flavor. Wait for it before flipping.","4":"Check the chops with a thermometer: 145\u00b0F, then rest 3 minutes."},"store":"Fridge 3 days.","kcal":467,"p":36,"f":28,"c":17,"tags":["protein25"]},{"n":42,"t":"Salmon with Lemon Rice","ch":"3 One-Pan Dinners","sv":4,"pr":10,"ck":25,"ing":[["atlantic salmon raw",600],["white rice long grain raw",200],["chicken broth",480],["lemon juice",45],["butter",28],["garlic raw",9],["dill fresh",8],["olive oil",10]],"st":["Cook the rice in the broth with the lemon juice: bring to a boil, add the rice, cover and simmer on low about 18 minutes. Rest 5 minutes.","Pat the salmon dry and season with salt and pepper. Mince the garlic.","Heat the oil in a large skillet over medium-high heat. Place the salmon skin side down and cook 4 minutes, then flip and cook 3 to 4 minutes until it flakes easily.","In a small pan, melt the butter with the garlic over low heat 1 minute.","Fluff the rice. Top with the salmon and spoon the garlic butter over it.","Finish with dill."],"tp":{"2":"Start with the skin side down. It crisps and protects the fish from overcooking.","3":"Salmon is done when it flakes easily with a fork."},"store":"Fridge 2 days.","kcal":581,"p":35,"f":29,"c":42,"tags":["protein25"]},{"n":43,"t":"Chicken and Green Bean Stir-Fry","ch":"3 One-Pan Dinners","sv":4,"pr":15,"ck":20,"ing":[["chicken breast raw",600],["green beans fresh",400],["soy sauce",45],["garlic raw",12],["ginger root raw",8],["honey",20],["cornstarch",10],["vegetable oil",20],["sesame oil",5],["white rice long grain raw",180]],"st":["Cook the rice. Slice the chicken thinly and toss with the cornstarch. Trim the green beans and cut in half. Mince the garlic and ginger.","Mix the soy sauce, honey and sesame oil with 2 tablespoons water.","Heat half the vegetable oil in a large skillet over high heat. Stir-fry the chicken 4 to 5 minutes until cooked through. Move to a plate.","Add the remaining oil, green beans, garlic and ginger. Stir-fry 5 minutes, adding a splash of water, until bright green and tender-crisp.","Return the chicken, pour in the sauce and toss 1 minute until glossy.","Serve over the rice."],"tp":{"0":"Cut the chicken in thin strips so it cooks in 4 to 5 minutes.","3":"Add a splash of water when the green beans cook. The steam makes them tender but still crisp."},"store":"Fridge 4 days.","kcal":467,"p":40,"f":11,"c":51,"tags":["protein25"]},{"n":44,"t":"Egg Roll in a Bowl","ch":"3 One-Pan Dinners","sv":4,"pr":10,"ck":15,"ing":[["ground turkey 93% raw",600],["coleslaw mix",400],["soy sauce",45],["garlic raw",12],["ginger root raw",8],["sesame oil",10],["vegetable oil",10],["green onion raw",30]],"st":["Mince the garlic and ginger, slice the green onion.","Heat the vegetable oil in a large skillet or wok over medium-high heat. Add the turkey, garlic and ginger and cook 6 to 8 minutes, breaking it up, until 165\u00b0F.","Add the coleslaw mix and stir-fry 5 to 6 minutes until wilted but still a little crisp.","Stir in the soy sauce and sesame oil and cook 1 minute.","Top with the green onion and serve hot."],"tp":{"1":"Get the turkey well browned before adding the cabbage.","2":"Cook the coleslaw mix until it is wilted but still has some crunch."},"store":"Fridge 4 days. Freezer 2 months.","kcal":309,"p":31,"f":18,"c":8,"tags":["freezer","protein25"]},{"n":45,"t":"Smoked Sausage and Cabbage Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":30,"ing":[["chicken sausage precooked",600],["cabbage raw",600],["potato raw",400],["yellow onion raw",150],["olive oil",20],["garlic raw",9],["chicken broth",120],["dijon mustard",20]],"st":["Slice the sausage into coins. Dice the potato into 1/2-inch cubes, slice the onion, chop the cabbage and mince the garlic.","Heat the oil in a large deep skillet over medium-high heat. Brown the sausage 5 minutes. Move to a plate.","Add the onion, potato and garlic and cook 8 minutes, stirring, until the potatoes begin to brown.","Add the cabbage, broth and mustard. Cover and cook 12 minutes until the cabbage and potatoes are tender.","Return the sausage, uncover and cook 3 minutes until the liquid reduces."],"tp":{"1":"Brown the sausage well. The browned bits flavor the whole skillet.","3":"Cover the pan so the cabbage steams and softens."},"store":"Fridge 4 days.","kcal":304,"p":25,"f":8,"c":35,"tags":[]},{"n":46,"t":"Beef Stroganoff with Yogurt Sauce","ch":"3 One-Pan Dinners","sv":6,"pr":15,"ck":30,"ing":[["beef top sirloin raw",700],["egg noodles dry",300],["mushrooms white raw",400],["yellow onion raw",150],["beef broth",360],["greek yogurt plain nonfat",240],["all-purpose flour",30],["butter",28],["dijon mustard",15],["worcestershire sauce",15],["garlic raw",12],["parsley fresh",10]],"st":["Boil the noodles in salted water, drain and set aside. Slice the sirloin thinly against the grain, slice the mushrooms and onion, mince the garlic.","Melt half the butter in a large skillet over high heat. Sear the beef 1 to 2 minutes per side in batches. Move to a plate.","Add the remaining butter, onion and mushrooms and cook 6 to 8 minutes until browned. Add the garlic for 30 seconds.","Stir in the flour for 1 minute, then add the broth, mustard and Worcestershire. Simmer 5 minutes until thickened.","Take the pan off the heat and stir in the yogurt so it does not curdle.","Return the beef with its juices. Toss with the noodles and top with parsley."],"tp":{"1":"Sear the beef in batches. Do not crowd the pan, or it steams and turns grey.","4":"Always add the yogurt off the heat. High heat makes it curdle."},"store":"Fridge 4 days. Reheat gently.","kcal":541,"p":39,"f":21,"c":48,"tags":["protein25"]},{"n":47,"t":"Chicken Pot Pie Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":15,"ck":30,"ing":[["chicken breast raw",700],["peas and carrots frozen",300],["potato raw",300],["yellow onion raw",150],["chicken broth",480],["milk 2%",240],["all-purpose flour",40],["butter",42],["thyme dried",2],["pie crust baked",100]],"st":["Dice the potato and chicken into small cubes. Chop the onion.","In a large deep skillet, melt the butter over medium heat. Cook the onion 4 minutes, then stir in the flour for 1 minute.","Slowly whisk in the broth and milk. Simmer 5 minutes until thickened.","Add the chicken, potato and thyme. Cover and simmer 12 minutes until the potato is tender and the chicken is 165\u00b0F.","Stir in the peas and carrots and cook 3 minutes. Season with salt and pepper.","Crumble the baked pie crust over the top just before serving."],"tp":{"1":"Cook the flour in butter for 1 minute so the sauce does not taste raw.","5":"Add the crust at the last minute so it stays crisp."},"store":"Fridge 4 days. Freezer 2 months without the crust.","kcal":399,"p":32,"f":15,"c":34,"tags":["freezer","protein25"]},{"n":48,"t":"Tuna Noodle Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":25,"ing":[["tuna canned in water drained",450],["egg noodles dry",300],["peas frozen",150],["milk 2%",360],["chicken broth",360],["cheddar cheese",150],["greek yogurt plain nonfat",120],["yellow onion raw",100],["all-purpose flour",20],["butter",28]],"st":["Chop the onion and drain the tuna.","In a large deep skillet, melt the butter over medium heat. Cook the onion 4 minutes, stir in the flour for 1 minute.","Whisk in the broth and milk and bring to a simmer.","Add the dry noodles, cover and cook 8 minutes, stirring now and then, until tender.","Stir in the peas and cook 2 minutes.","Take the pan off the heat. Gently fold in the tuna, cheddar and yogurt."],"tp":{"1":"Cooking the flour for 1 minute gives a smooth, thick sauce.","5":"Fold gently so the tuna stays in chunks."},"store":"Fridge 3 days.","kcal":474,"p":34,"f":17,"c":48,"tags":["protein25"]},{"n":49,"t":"Black Bean Chicken Rice Skillet","ch":"3 One-Pan Dinners","sv":6,"pr":10,"ck":35,"ing":[["chicken breast raw",800],["white rice long grain raw",200],["black beans canned",250],["corn sweet canned",150],["diced tomatoes canned",400],["chicken broth",480],["chili powder",12],["cumin ground",4],["cheddar cheese",120],["yellow onion raw",120],["olive oil",10]],"st":["Cut the chicken into 1-inch pieces and season with the chili powder, cumin and 1 teaspoon salt. Dice the onion. Drain and rinse the beans and corn.","Heat the oil in a large deep skillet over medium-high heat. Sear the chicken and onion 5 minutes.","Add the rice, broth, tomatoes, beans and corn. Stir and bring to a boil.","Cover and simmer on low 20 minutes, without lifting the lid, until the rice is tender and the chicken is 165\u00b0F.","Sprinkle with the cheddar and cover 2 minutes. Fluff and serve."],"tp":{"1":"Cut the chicken in even 1-inch pieces so it cooks through in the same time as the rice.","3":"Do not lift the lid. The rice cooks in the steam."},"store":"Fridge 5 days. Freezer 3 months.","kcal":463,"p":42,"f":13,"c":44,"tags":["freezer","protein25"]},{"n":50,"t":"Turkey Baked Ziti","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":20,"ck":45,"ing":[["ziti pasta dry",400],["ground turkey 93% raw",600],["ricotta part skim",250],["mozzarella part skim",240],["marinara sauce",700],["parmesan grated",40],["yellow onion raw",100],["garlic raw",12],["olive oil",15]],"st":["Heat the oven to 375\u00b0F. Boil the ziti in salted water until just al dente, about 2 minutes under the package time. Drain.","Heat the oil in a large skillet. Cook the onion 4 minutes, add the turkey and garlic and cook 6 to 8 minutes until 165\u00b0F.","Stir in the marinara and simmer 5 minutes.","In a 9x13-inch dish, mix the pasta, meat sauce and ricotta.","Top with the mozzarella and parmesan. Cover with foil and bake 25 minutes.","Uncover and bake 10 minutes until bubbly and golden. Rest 5 minutes."],"tp":{"0":"Cook the ziti 2 minutes less than the package. It finishes in the oven.","4":"Foil keeps the pasta from drying out. Remove it for the last 10 minutes to brown the cheese."},"store":"Fridge 5 days. Freezer 3 months.","kcal":506,"p":34,"f":19,"c":49,"tags":["freezer","protein25"]},{"n":51,"t":"Chicken Enchilada Casserole","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":35,"ing":[["chicken breast raw",800],["corn tortilla 6 inch",312],["enchilada sauce",600],["black beans canned",250],["cheddar cheese",200],["yellow onion raw",150],["greek yogurt plain nonfat",120]],"st":["Heat the oven to 375\u00b0F. Poach the chicken in simmering water 15 minutes until 165\u00b0F, then shred with two forks.","Mix the chicken, drained beans, diced onion and yogurt.","Spread 1/2 cup enchilada sauce in a 9x13-inch dish. Add a layer of tortillas, half the filling and a third of the cheddar.","Repeat with a second layer. Top with the rest of the tortillas, sauce and cheese.","Bake 25 to 30 minutes until bubbly.","Rest 5 minutes before cutting into 8 squares."],"tp":{"1":"Poached chicken shreds more easily and stays moist.","4":"The casserole is done when the edges bubble and the cheese is golden."},"store":"Fridge 5 days. Freezer 3 months.","kcal":373,"p":35,"f":13,"c":29,"tags":["freezer","protein25"]},{"n":52,"t":"Classic Meatloaf with Tangy Glaze","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":60,"ing":[["ground beef 90% raw",600],["ground turkey 93% raw",400],["egg whole raw",100],["rolled oats",80],["milk 2%",120],["yellow onion raw",150],["ketchup",100],["worcestershire sauce",15],["garlic raw",9],["brown sugar",15],["apple cider vinegar",15]],"st":["Heat the oven to 375\u00b0F. Grate the onion on a box grater.","In a large bowl, mix the beef, turkey, egg, oats, milk, onion, garlic, Worcestershire, 1 teaspoon salt and pepper gently with your hands. Do not overmix.","Shape into a 9x5-inch loaf on a lined baking sheet.","Whisk the ketchup, brown sugar and vinegar. Brush half over the loaf.","Bake 50 to 55 minutes. Brush with the rest of the glaze halfway through. Cook until 160\u00b0F in the center.","Rest 10 minutes before slicing."],"tp":{"1":"Mix gently with your hands. Overmixed meatloaf gets dense.","4":"Check the temperature: 160\u00b0F in the center."},"store":"Fridge 4 days. Freezer 3 months in slices.","kcal":302,"p":29,"f":14,"c":15,"tags":["freezer","protein25"]},{"n":53,"t":"Cheesy Chicken and Rice Bake","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":50,"ing":[["chicken breast raw",700],["white rice long grain raw",300],["chicken broth",600],["milk 2%",240],["cheddar cheese",200],["broccoli raw",300],["yellow onion raw",100],["garlic raw",9],["greek yogurt plain nonfat",120],["butter",28],["all-purpose flour",30]],"st":["Heat the oven to 375\u00b0F. Cut the chicken into 1-inch pieces and the broccoli into small florets.","Melt the butter in a pan over medium heat. Cook the onion and garlic 4 minutes, stir in the flour for 1 minute, then whisk in the broth and milk.","In a 9x13-inch dish, mix the uncooked rice, chicken, broccoli and the hot sauce. Stir in the yogurt.","Cover tightly with foil and bake 40 minutes.","Uncover, stir, sprinkle with the cheddar and bake 8 minutes until melted and the chicken is 165\u00b0F.","Rest 5 minutes and fluff."],"tp":{"2":"Stir the rice into the sauce so every grain is coated and cooks evenly.","3":"Cover with foil tightly so the rice steams."},"store":"Fridge 5 days. Freezer 3 months.","kcal":429,"p":33,"f":15,"c":40,"tags":["freezer","protein25"]},{"n":54,"t":"Shepherd's Pie with Mashed Potato Topping","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":20,"ck":50,"ing":[["ground beef 90% raw",800],["potato raw",900],["milk 2%",120],["butter",28],["cottage cheese lowfat 2%",150],["peas and carrots frozen",300],["yellow onion raw",150],["tomato paste",30],["beef broth",240],["all-purpose flour",20],["worcestershire sauce",15]],"st":["Heat the oven to 400\u00b0F. Peel and cut the potatoes and boil in salted water 15 minutes until tender. Drain.","Mash with the milk, butter and cottage cheese until smooth. Season with salt and pepper.","In a large skillet, brown the beef and onion 8 minutes, breaking it up. Drain the fat.","Stir in the tomato paste, flour and Worcestershire for 1 minute. Add the broth and simmer 10 minutes until thick. Stir in the peas and carrots.","Spread the filling in a 9x13-inch dish and cover with the potato, smoothing with a fork.","Bake 20 minutes until the top is golden. Rest 5 minutes."],"tp":{"1":"Mash the potatoes while they are still hot for the creamiest topping.","4":"Smooth the top with a fork, then make ridges. They brown nicely."},"store":"Fridge 5 days. Freezer 3 months.","kcal":355,"p":27,"f":14,"c":31,"tags":["freezer","protein25"]},{"n":55,"t":"Sheet-Pan Sausage and Veggies","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":15,"ck":35,"ing":[["chicken sausage precooked",600],["broccoli raw",450],["potato raw",600],["carrot raw",250],["olive oil",30],["paprika",4],["garlic powder",3]],"st":["Heat the oven to 425\u00b0F. Cut the potatoes into 3/4-inch cubes, slice the carrots and cut the broccoli into florets. Slice the sausage.","Toss the potatoes and carrots on two sheet pans with the oil, paprika, garlic powder, 1 teaspoon salt and pepper.","Roast 15 minutes.","Add the sausage and broccoli to the pans and stir.","Roast 15 to 20 minutes more until the vegetables are browned at the edges. Swap the pans halfway for even browning."],"tp":{"1":"Use two pans so the vegetables are not crowded. Crowded vegetables steam instead of roasting.","3":"Swap the pans between racks halfway through for even browning."},"store":"Fridge 4 days.","kcal":350,"p":26,"f":10,"c":41,"tags":["protein25"]},{"n":56,"t":"Stuffed Bell Peppers","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":20,"ck":55,"ing":[["bell pepper red raw",900],["ground beef 90% raw",600],["white rice long grain raw",150],["marinara sauce",400],["cheddar cheese",120],["yellow onion raw",120],["garlic raw",9],["olive oil",10]],"st":["Heat the oven to 375\u00b0F. Cook the rice. Halve the peppers through the stem and remove the seeds.","Brown the beef with the onion 8 minutes, breaking it up, until no pink remains. Add the garlic for 30 seconds and drain the fat.","Stir in the cooked rice and half the marinara. Season with salt and pepper.","Fill the pepper halves and set them cut-side up in a baking dish. Spread the remaining sauce on top.","Cover with foil and bake 35 minutes.","Uncover, top with the cheddar and bake 5 minutes until melted."],"tp":{"0":"Cut peppers from the stem to the bottom so they stand upright when filled.","4":"Cover with foil to cook the peppers through, then uncover to melt the cheese."},"store":"Fridge 4 days. Freezer 3 months.","kcal":445,"p":29,"f":20,"c":37,"tags":["freezer","protein25"]},{"n":57,"t":"Chicken Parmesan Bake","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":20,"ck":35,"ing":[["chicken breast raw",900],["marinara sauce",500],["mozzarella part skim",180],["parmesan grated",50],["panko breadcrumbs",80],["egg whole raw",100],["olive oil",20],["italian seasoning",3]],"st":["Heat the oven to 425\u00b0F and oil a sheet pan. If the chicken is thick, slice each breast in half horizontally, so the cutlets are even.","Mix the panko, parmesan, Italian seasoning, salt and pepper in a shallow dish. Beat the egg in another.","Dip each cutlet in egg, then in the crumbs, pressing to coat. Place on the pan and drizzle with the oil.","Bake 15 minutes until the crumbs are golden.","Spoon the marinara over each piece, add the mozzarella and bake 10 to 12 minutes until bubbly and 165\u00b0F inside."],"tp":{"0":"Pound or slice the chicken to an even thickness so it cooks evenly.","2":"Press the crumbs onto the chicken so they stay on.","4":"Check the temperature: 165\u00b0F."},"store":"Fridge 4 days. Freezer 3 months.","kcal":440,"p":48,"f":18,"c":18,"tags":["freezer","protein25"]},{"n":58,"t":"Taco Casserole","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":35,"ing":[["ground beef 90% raw",700],["black beans canned",250],["taco seasoning",30],["diced tomatoes canned",400],["cheddar cheese",200],["tortilla chips",120],["greek yogurt plain nonfat",120],["yellow onion raw",120]],"st":["Heat the oven to 375\u00b0F. Dice the onion.","Brown the beef and onion 8 minutes, breaking it up. Drain the fat.","Stir in the taco seasoning, tomatoes and drained beans. Simmer 5 minutes.","In a 9x13-inch dish, spread half the chips, then half the meat and half the cheddar. Repeat the layers.","Bake 20 minutes until bubbly.","Serve with spoonfuls of yogurt."],"tp":{"2":"Layer evenly all the way to the edges so every serving has chips, meat and cheese.","5":"Serve with yogurt in place of sour cream."},"store":"Fridge 4 days. Freezer 3 months without the chips.","kcal":384,"p":28,"f":20,"c":22,"tags":["freezer","protein25"]},{"n":59,"t":"Tuna Noodle Casserole","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":40,"ing":[["tuna canned in water drained",450],["egg noodles dry",300],["peas frozen",150],["milk 2%",360],["cheddar cheese",200],["greek yogurt plain nonfat",150],["yellow onion raw",100],["butter",28],["all-purpose flour",25],["breadcrumbs plain",40]],"st":["Heat the oven to 375\u00b0F. Boil the noodles 2 minutes less than the package says. Drain.","In a pot, melt the butter and cook the diced onion 4 minutes. Stir in the flour for 1 minute, then whisk in the milk.","Simmer 3 minutes until thickened. Off the heat, stir in the cheddar until melted, then the yogurt.","Mix the sauce with the noodles, tuna and peas in a 9x13-inch baking dish.","Top with the breadcrumbs.","Bake 25 minutes until bubbling and golden. Rest 5 minutes."],"tp":{"0":"Cook the noodles 2 minutes under the package. They finish in the oven.","4":"Sprinkle the crumbs on top so they brown and get crunchy."},"store":"Fridge 3 days.","kcal":402,"p":27,"f":15,"c":40,"tags":["protein25"]},{"n":60,"t":"Turkey Pot Pie","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":20,"ck":50,"ing":[["ground turkey 93% raw",800],["peas and carrots frozen",300],["potato raw",300],["chicken broth",480],["milk 2%",240],["all-purpose flour",40],["yellow onion raw",150],["butter",42],["puff pastry",200]],"st":["Heat the oven to 400\u00b0F. Dice the potato and boil 8 minutes until just tender. Drain. Chop the onion.","In a large oven-safe skillet or pot, brown the turkey and onion 8 minutes until 165\u00b0F.","Add the butter, stir in the flour for 1 minute, then pour in the broth and milk. Simmer 6 minutes until thick.","Stir in the potato and the peas and carrots. Season. Pour into a 9x13-inch baking dish if needed.","Cover with the puff pastry, trim the edges and cut 3 small steam vents.","Bake 25 to 30 minutes until the pastry is puffed and deep golden."],"tp":{"1":"Cook the potatoes only until just tender. They finish in the oven.","5":"The pastry should be puffed and deep golden before you take it out."},"store":"Fridge 4 days. Freezer 3 months.","kcal":420,"p":25,"f":23,"c":29,"tags":["freezer"]},{"n":61,"t":"Hash Brown Egg Casserole","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":50,"ing":[["hash browns frozen",600],["egg whole raw",500],["turkey breakfast sausage raw",450],["cheddar cheese",200],["milk 2%",240],["yellow onion raw",100]],"st":["Heat the oven to 375\u00b0F and grease a 9x13-inch dish.","Brown the sausage with the diced onion 8 minutes until 165\u00b0F. Drain the fat.","Spread the hash browns (no need to thaw) in the dish. Top with the sausage mixture and cheddar.","Whisk the eggs and milk with salt and pepper and pour evenly over the top.","Bake 40 to 45 minutes until set in the middle and golden.","Rest 5 minutes before cutting into 8 pieces."],"tp":{"1":"Drain the sausage fat so the casserole is not greasy.","4":"A knife in the middle should come out clean."},"store":"Fridge 5 days. Freezer 2 months.","kcal":360,"p":27,"f":19,"c":19,"tags":["freezer","protein25"]},{"n":62,"t":"Chicken Mac and Cheese with Yogurt Sauce","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":40,"ing":[["macaroni elbow dry",400],["chicken breast raw",600],["cheddar cheese",300],["milk 2%",480],["greek yogurt plain nonfat",240],["all-purpose flour",30],["butter",42],["breadcrumbs plain",40]],"st":["Heat the oven to 375\u00b0F. Cook the macaroni 1 minute less than the package says. Drain. Dice the chicken and cook in a skillet 8 minutes until 165\u00b0F.","In a large pot, melt the butter and whisk in the flour for 1 minute. Slowly whisk in the milk.","Simmer 4 minutes, stirring, until thickened. Off the heat, stir in the cheddar until melted, then the yogurt.","Fold in the macaroni and chicken. Season with salt and pepper.","Pour into a 9x13-inch dish, sprinkle with the breadcrumbs and bake 20 minutes until golden."],"tp":{"0":"Undercook the macaroni 1 minute. It absorbs sauce in the oven.","3":"Add the cheese off the heat so the sauce stays smooth."},"store":"Fridge 4 days. Freezer 2 months.","kcal":545,"p":38,"f":21,"c":49,"tags":["freezer","protein25"]},{"n":63,"t":"Burrito Casserole","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":20,"ck":40,"ing":[["ground beef 90% raw",600],["flour tortilla 10 inch",384],["black beans canned",400],["enchilada sauce",500],["cheddar cheese",200],["yellow onion raw",120],["greek yogurt plain nonfat",120],["rice cooked",300]],"st":["Heat the oven to 375\u00b0F. Brown the beef and the diced onion 8 minutes and drain the fat.","Stir in the beans and cooked rice and season with salt.","Spread 1/2 cup sauce in a 9x13-inch dish. Add a layer of tortillas, half the filling, a third of the sauce and a third of the cheddar.","Repeat with a second layer. Top with the remaining sauce and cheese.","Bake 25 to 30 minutes until bubbly.","Rest 5 minutes, then serve with yogurt."],"tp":{"2":"Spread sauce on the bottom so the tortillas do not stick.","4":"Rest 5 minutes before cutting so the layers hold."},"store":"Fridge 5 days. Freezer 3 months.","kcal":507,"p":31,"f":21,"c":48,"tags":["freezer","protein25"]},{"n":64,"t":"Baked Chicken Meatballs","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":15,"ck":30,"ing":[["chicken breast raw",900],["breadcrumbs plain",60],["parmesan grated",50],["egg whole raw",100],["garlic raw",9],["yellow onion raw",60],["marinara sauce",400],["italian seasoning",3],["parsley fresh",8]],"st":["Heat the oven to 400\u00b0F and line a sheet pan with parchment.","Cut the chicken into chunks and pulse in a food processor until finely minced. Do not pur\u00e9e.","Mix the chicken with the breadcrumbs, parmesan, egg, grated onion, garlic, Italian seasoning and 1/2 teaspoon salt.","Roll into 24 balls with damp hands and place on the pan.","Bake 20 minutes until golden and 165\u00b0F inside.","Warm the marinara in a pan, add the meatballs and toss. Sprinkle with parsley."],"tp":{"1":"Pulse the chicken only until finely chopped. Do not pur\u00e9e it.","3":"Wet your hands so the mixture does not stick."},"store":"Fridge 4 days. Freezer 3 months.","kcal":320,"p":41,"f":9,"c":15,"tags":["freezer","protein25"]},{"n":65,"t":"Ricotta-Style Stuffed Shells","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":25,"ck":35,"ing":[["jumbo pasta shells dry",250],["cottage cheese lowfat 2%",450],["mozzarella part skim",200],["parmesan grated",40],["egg whole raw",50],["spinach raw",120],["marinara sauce",600],["garlic raw",6],["italian seasoning",3]],"st":["Heat the oven to 375\u00b0F. Boil the shells 2 minutes less than the package says. Drain and spread out to cool so they do not tear.","Squeeze the excess water from the spinach after chopping it. Mix the cottage cheese, half the mozzarella, parmesan, egg, spinach, garlic and Italian seasoning.","Spread 1/2 cup sauce in a 9x13-inch dish.","Spoon the filling into the shells and place them in the dish.","Cover with the remaining sauce and mozzarella. Cover with foil.","Bake 25 minutes until bubbly. Rest 5 minutes."],"tp":{"0":"Cook the shells 2 minutes under the package. Handle them gently so they do not tear.","1":"Squeeze the spinach dry so the filling is not watery."},"store":"Fridge 4 days. Freezer 3 months.","kcal":397,"p":26,"f":12,"c":45,"tags":["freezer","protein25"]},{"n":66,"t":"Sheet-Pan Chicken Fajitas","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":15,"ck":25,"ing":[["chicken breast raw",900],["bell pepper red raw",450],["yellow onion raw",250],["olive oil",30],["chili powder",15],["cumin ground",4],["lime juice",45],["flour tortilla 10 inch",384],["greek yogurt plain nonfat",150]],"st":["Heat the oven to 425\u00b0F and line a large sheet pan with parchment.","Slice the chicken, peppers and onion into 1/2-inch strips.","Toss with the oil, chili powder, cumin, lime juice and 1 teaspoon salt.","Spread in a single layer on the pan. Roast 20 to 22 minutes, stirring once, until the chicken is 165\u00b0F and the edges are charred.","Warm the tortillas and serve with the filling and yogurt."],"tp":{"2":"Spread everything in one layer. Do not pile it up.","3":"Stir once halfway for even browning."},"store":"Fridge 4 days.","kcal":482,"p":43,"f":15,"c":43,"tags":["protein25"]},{"n":67,"t":"Pizza Casserole","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":15,"ck":45,"ing":[["rotini pasta dry",350],["turkey italian sausage raw",450],["marinara sauce",600],["mozzarella part skim",240],["yellow onion raw",120],["bell pepper red raw",150],["parmesan grated",30],["olive oil",10]],"st":["Heat the oven to 375\u00b0F. Cook the rotini 2 minutes less than the package says. Drain.","Brown the sausage, onion and diced pepper 8 minutes until 165\u00b0F. Drain the fat.","Stir in the marinara and the pasta.","Pour into a 9x13-inch dish and top with the mozzarella and parmesan.","Cover with foil and bake 20 minutes. Uncover and bake 10 minutes until bubbly.","Rest 5 minutes before serving."],"tp":{"0":"Undercook the pasta 2 minutes. It finishes baking in the sauce.","4":"Cover first so the pasta does not dry out, then uncover to brown the cheese."},"store":"Fridge 5 days. Freezer 3 months.","kcal":401,"p":26,"f":14,"c":42,"tags":["freezer","protein25"]},{"n":68,"t":"Oven-Baked Chicken Thighs with Potatoes","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":10,"ck":50,"ing":[["chicken thigh meat and skin raw",1200],["potato raw",800],["olive oil",30],["garlic raw",15],["paprika",5],["thyme dried",3],["lemon juice",30]],"st":["Heat the oven to 425\u00b0F. Cut the potatoes into 3/4-inch cubes. Mince the garlic.","Toss the potatoes with half the oil, half the garlic, 1/2 teaspoon salt and pepper. Spread on a large sheet pan.","Pat the thighs dry. Rub with the paprika, thyme, lemon juice, the rest of the oil and garlic and 1 teaspoon salt.","Set the thighs skin side up on top of the potatoes.","Roast 40 to 45 minutes until the chicken is 175\u00b0F and the skin is crisp. Stir the potatoes once halfway.","Rest 5 minutes and spoon the pan juices over the potatoes."],"tp":{"3":"Place the thighs skin side up for crisp skin.","4":"Check the temperature: 175\u00b0F in the thickest part."},"store":"Fridge 4 days. Freezer 3 months.","kcal":597,"p":36,"f":38,"c":26,"tags":["freezer","protein25"]},{"n":69,"t":"Layered Beef Lasagna Casserole","ch":"4 Oven Bakes & Casseroles","sv":8,"pr":20,"ck":60,"ing":[["ground beef 90% raw",700],["lasagna noodles dry",250],["ricotta part skim",300],["mozzarella part skim",300],["marinara sauce",800],["parmesan grated",40],["yellow onion raw",120],["garlic raw",12],["egg whole raw",50],["olive oil"
