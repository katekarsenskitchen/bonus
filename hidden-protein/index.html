,10]],"st":["Heat the oven to 375\u00b0F. Dice the onion and mince the garlic.","Brown the beef with the onion 8 minutes, add the garlic for 30 seconds and drain the fat. Stir in the marinara and simmer 5 minutes.","Mix the ricotta, egg and parmesan with a fork until smooth.","Spread 1 cup sauce in a 9x13-inch dish. Add a layer of dry noodles, breaking them to fit, then a third of the ricotta, mozzarella and sauce.","Repeat to make 3 layers, ending with sauce and mozzarella. Press down so the noodles are covered by sauce.","Cover tightly with foil and bake 40 minutes. Uncover and bake 15 minutes until golden.","Rest 10 minutes so the layers set before cutting."],"tp":{"3":"Use plenty of sauce between the dry noodles. They need the moisture to cook.","5":"Cover tightly with foil, then uncover to brown the top.","6":"Resting 10 minutes makes the layers hold when you cut."},"store":"Fridge 5 days. Freezer 3 months.","kcal":516,"p":39,"f":23,"c":36,"tags":["freezer","protein25"]},{"n":70,"t":"Baked Salmon Patties","ch":"4 Oven Bakes & Casseroles","sv":6,"pr":15,"ck":20,"ing":[["salmon canned",600],["egg whole raw",150],["breadcrumbs plain",60],["greek yogurt plain nonfat",60],["yellow onion raw",60],["dijon mustard",15],["lemon juice",15],["olive oil",20],["dill fresh",5]],"st":["Heat the oven to 425\u00b0F and oil a sheet pan.","Drain the salmon and flake it in a bowl, removing any large bones. Grate the onion.","Add the egg, breadcrumbs, yogurt, onion, mustard, lemon juice, dill, 1/4 teaspoon salt and pepper. Mix gently.","Shape into 8 patties about 1/2 inch thick and place on the pan. Chill 10 minutes if they feel soft.","Brush with the oil. Bake 8 minutes, flip and bake 8 minutes more until golden.","Serve with extra lemon."],"tp":{"0":"Preheat the oiled pan so the bottoms brown and do not stick.","3":"Chilling the patties makes them hold together."},"store":"Fridge 3 days. Freezer 2 months.","kcal":255,"p":29,"f":11,"c":9,"tags":["freezer","protein25"]},{"n":71,"t":"Fudgy Yogurt Brownies","ch":"5 Little Sweets","sv":12,"pr":10,"ck":25,"ing":[["greek yogurt plain nonfat",240],["egg whole raw",150],["cocoa powder",45],["all-purpose flour",100],["maple syrup",120],["butter",56],["baking powder",4],["mini chocolate chips",90],["vanilla extract",6]],"st":["Heat the oven to 350\u00b0F. Line an 8x8-inch pan with parchment, leaving an overhang on two sides.","Melt the butter and let it cool 2 minutes.","Whisk the yogurt, eggs, maple syrup, butter and vanilla until smooth.","Sift in the cocoa, flour and baking powder and stir until just combined. Fold in the chocolate chips.","Spread in the pan. Bake 22 to 25 minutes until the top is set and a toothpick comes out with a few moist crumbs.","Cool completely, 1 hour, then lift out and cut into 12 squares."],"tp":{"0":"Parchment with an overhang lets you lift the whole slab out.","4":"Take them out while a toothpick still has a few moist crumbs. That keeps them fudgy."},"store":"Room temp 2 days. Fridge 5 days. Freezer 3 months.","kcal":166,"p":6,"f":8,"c":21,"tags":["freezer"]},{"n":72,"t":"Banana Bread with Greek Yogurt","ch":"5 Little Sweets","sv":10,"pr":10,"ck":55,"ing":[["banana raw",350],["greek yogurt plain nonfat",180],["egg whole raw",100],["whole wheat flour",180],["brown sugar",80],["butter",56],["baking powder",6],["walnuts",50],["vanilla extract",5]],"st":["Heat the oven to 350\u00b0F. Grease a 9x5-inch loaf pan and line it with parchment.","Mash the bananas well. Melt the butter and cool 2 minutes. Chop the walnuts.","Whisk the bananas, yogurt, eggs, butter, brown sugar and vanilla.","Add the flour and baking powder. Fold gently just until combined, then fold in the walnuts.","Pour into the pan. Bake 50 to 55 minutes until a toothpick in the center comes out clean. Cover with foil if the top browns too fast.","Cool 15 minutes in the pan, then on a rack. Slice into 10."],"tp":{"1":"Use very ripe, spotted bananas for the best flavor.","4":"If the top browns too fast, cover loosely with foil."},"store":"Room temp 2 days. Freezer 3 months.","kcal":222,"p":7,"f":9,"c":30,"tags":["freezer"]},{"n":73,"t":"Chewy Oatmeal Cookies","ch":"5 Little Sweets","sv":16,"pr":10,"ck":13,"ing":[["rolled oats",200],["all-purpose flour",120],["egg whole raw",100],["butter",110],["brown sugar",120],["cinnamon ground",4],["baking powder",4],["raisins",100],["vanilla extract",5]],"st":["Heat the oven to 350\u00b0F and line two baking sheets with parchment.","Beat the softened butter and brown sugar 2 minutes until fluffy. Beat in the egg and vanilla.","Stir in the oats, flour, cinnamon and baking powder until just combined. Fold in the raisins.","Drop 16 level spoonfuls of dough onto the sheets, 2 inches apart, and press down lightly.","Bake 11 to 13 minutes until the edges are golden and the centers look soft.","Cool on the sheet 5 minutes, then move to a rack. They firm up as they cool."],"tp":{"1":"Beat the butter and sugar until fluffy for chewy cookies.","4":"Take them out when the centers still look soft. They firm up as they cool."},"store":"Airtight 4 days. Freezer 3 months.","kcal":183,"p":4,"f":7,"c":27,"tags":["freezer"]},{"n":74,"t":"Peanut Butter Cookies","ch":"5 Little Sweets","sv":16,"pr":10,"ck":12,"ing":[["peanut butter",250],["egg whole raw",50],["brown sugar",100],["greek yogurt plain nonfat",60],["all-purpose flour",100],["baking powder",3],["vanilla extract",4]],"st":["Heat the oven to 350\u00b0F and line a baking sheet with parchment.","Mix the peanut butter, brown sugar, egg, yogurt and vanilla until smooth.","Stir in the flour and baking powder until a soft dough forms.","Roll into 16 balls and place 2 inches apart. Press each flat with a fork, then again in the other direction to make a crisscross.","Bake 10 to 12 minutes until the edges are set and lightly golden.","Cool 5 minutes on the sheet before moving. They are soft at first."],"tp":{"3":"Press with a fork in both directions to make the classic crisscross.","5":"Let them cool on the pan 5 minutes before moving. They are fragile when hot."},"store":"Airtight 4 days. Freezer 3 months.","kcal":147,"p":5,"f":8,"c":15,"tags":["freezer"]},{"n":75,"t":"Strawberry Cheesecake Cups","ch":"5 Little Sweets","sv":6,"pr":15,"ck":0,"ing":[["greek yogurt plain nonfat",300],["cream cheese light",120],["strawberries raw",300],["honey",50],["graham cracker crumbs",60],["vanilla extract",5]],"st":["Hull and chop the strawberries. Mix them with 1 tablespoon of the honey and let them stand 10 minutes.","Beat the cream cheese until smooth. Add the yogurt, remaining honey and vanilla and whisk until fluffy.","Spoon a layer of graham crumbs into the bottom of 6 cups.","Add a layer of the cream, then a layer of strawberries.","Repeat the layers, finishing with strawberries.","Chill at least 1 hour so the crumbs soften slightly."],"tp":{"0":"Letting the strawberries stand makes a natural juice for the cups.","5":"Chilling lets the crumbs soften into a cheesecake-like layer."},"store":"Fridge 3 days.","kcal":157,"p":8,"f":5,"c":22,"tags":["quick"]},{"n":76,"t":"Chocolate Mug Cake","ch":"5 Little Sweets","sv":1,"pr":5,"ck":2,"ing":[["egg whole raw",50],["cocoa powder",15],["greek yogurt plain nonfat",60],["maple syrup",20],["baking powder",2],["whole wheat flour",20],["milk 2%",30],["mini chocolate chips",15]],"st":["In a large microwave-safe mug, whisk the egg, yogurt, maple syrup and milk until smooth.","Add the cocoa, flour and baking powder and stir until no dry spots remain.","Stir in half the chocolate chips and scatter the rest on top.","Microwave 75 to 90 seconds, until the cake has risen and the top looks set. Microwaves vary, so start with 75 seconds.","Cool 1 minute, since the mug is hot."],"tp":{"3":"Microwaves differ. Start with 75 seconds, then add 10 seconds if the center is wet."},"store":"Best fresh.","kcal":349,"p":20,"f":13,"c":51,"tags":["quick"]},{"n":77,"t":"Cinnamon Apple Crisp","ch":"5 Little Sweets","sv":6,"pr":10,"ck":35,"ing":[["apple raw",720],["rolled oats",90],["butter",56],["brown sugar",50],["cinnamon ground",5],["walnuts",40],["greek yogurt plain nonfat",180]],"st":["Heat the oven to 375\u00b0F. Slice the apples thinly, keeping the peel on if you like, and toss with 2 teaspoons of the cinnamon in an 8x8-inch baking dish.","In a bowl, mix the oats, brown sugar, remaining cinnamon and chopped walnuts.","Melt the butter and stir it in until the crumble clumps.","Scatter the topping evenly over the apples.","Bake 30 to 35 minutes until the apples are tender and the top is golden and bubbling at the edges.","Cool 10 minutes. Serve warm with a spoonful of yogurt."],"tp":{"1":"Keep the peel on the apples for color and fiber, or peel them if you prefer.","4":"The crisp is ready when the apples are tender and the juices bubble at the edges."},"store":"Fridge 4 days. Reheat before serving.","kcal":283,"p":7,"f":13,"c":37,"tags":[]},{"n":78,"t":"Frozen Yogurt Bark","ch":"5 Little Sweets","sv":8,"pr":10,"ck":0,"ing":[["greek yogurt plain nonfat",600],["honey",60],["blueberries raw",100],["strawberries raw",100],["mini chocolate chips",30]],"st":["Line a baking sheet with parchment.","Stir the honey into the yogurt until smooth.","Spread about 1/2 inch thick on the sheet.","Scatter the berries and chocolate chips over the top and press them in lightly.","Freeze 3 hours until firm.","Break into 8 pieces. Serve right away, or freeze in a bag. They melt fast."],"tp":{"2":"Spread the yogurt evenly so the bark freezes at the same speed.","5":"Keep it frozen until serving. It melts fast."},"store":"Freezer 2 months.","kcal":96,"p":8,"f":1,"c":14,"tags":["quick","freezer"]},{"n":79,"t":"Pumpkin Spice Muffins","ch":"5 Little Sweets","sv":12,"pr":10,"ck":22,"ing":[["pumpkin puree canned",240],["greek yogurt plain nonfat",120],["egg whole raw",100],["whole wheat flour",160],["brown sugar",100],["butter",56],["baking powder",8],["cinnamon ground",5],["nutmeg ground",1]],"st":["Heat the oven to 350\u00b0F and line a 12-cup muffin tin with paper liners.","Melt the butter and cool 2 minutes.","Whisk the pumpkin, yogurt, eggs, brown sugar and butter until smooth.","In another bowl, mix the flour, baking powder, cinnamon, nutmeg and 1/4 teaspoon salt. Fold into the wet mix just until combined.","Fill the cups about 3/4 full.","Bake 20 to 22 minutes until a toothpick comes out clean. Cool 5 minutes in the tin."],"tp":{"2":"Whisk the pumpkin and yogurt well so there are no streaks.","5":"A toothpick should come out clean."},"store":"Fridge 5 days. Freezer 3 months.","kcal":137,"p":4,"f":5,"c":20,"tags":["freezer"]},{"n":80,"t":"Chocolate Pudding Cups","ch":"5 Little Sweets","sv":4,"pr":10,"ck":0,"ing":[["greek yogurt plain nonfat",400],["milk 2%",240],["cocoa powder",30],["maple syrup",60],["vanilla extract",5]],"st":["In a bowl, whisk the cocoa, maple syrup and 3 tablespoons of the milk to a smooth paste with no lumps.","Whisk in the rest of the milk, then the yogurt and vanilla until silky.","Divide among 4 cups.","Cover and chill at least 1 hour until thick and cold.","Top with berries or a little more yogurt if you like."],"tp":{"0":"Make a paste with a little milk first so the cocoa has no lumps."},"store":"Fridge 4 days.","kcal":149,"p":14,"f":3,"c":21,"tags":["quick"]},{"n":81,"t":"Lemon Yogurt Bars","ch":"5 Little Sweets","sv":12,"pr":15,"ck":30,"ing":[["greek yogurt plain nonfat",240],["egg whole raw",150],["lemon juice",60],["all-purpose flour",150],["honey",120],["butter",56],["baking powder",4],["graham cracker crumbs",120]],"st":["Heat the oven to 350\u00b0F. Line an 8x8-inch pan with parchment.","Melt the butter and stir it into the graham crumbs. Press firmly into the bottom of the pan.","Bake the crust 8 minutes.","Whisk the yogurt, eggs, honey and lemon juice until smooth. Whisk in the flour and baking powder.","Pour over the warm crust. Bake 20 to 22 minutes until set and lightly golden at the edges.","Cool 30 minutes, chill 1 hour, then cut into 12 bars."],"tp":{"2":"Bake the crust first so it stays crisp under the filling.","5":"Chill the bars before cutting for clean squares."},"store":"Fridge 5 days. Freezer 2 months.","kcal":183,"p":6,"f":6,"c":27,"tags":["freezer"]},{"n":82,"t":"Blueberry Yogurt Muffins","ch":"5 Little Sweets","sv":12,"pr":10,"ck":22,"ing":[["greek yogurt plain nonfat",240],["egg whole raw",100],["whole wheat flour",160],["honey",100],["butter",56],["baking powder",8],["blueberries raw",180],["milk 2%",60]],"st":["Heat the oven to 375\u00b0F and line a 12-cup muffin tin.","Melt the butter and cool 2 minutes.","Whisk the yogurt, eggs, honey, butter and milk.","Add the flour and baking powder and fold until just combined. Gently fold in the blueberries.","Fill the cups to the top.","Bake 20 to 22 minutes until golden and a toothpick comes out clean. Cool 5 minutes in the tin."],"tp":{"3":"Fold the blueberries in last and gently so the batter does not turn purple.","5":"Cool 5 minutes in the pan so the muffins release easily."},"store":"Fridge 5 days. Freezer 3 months.","kcal":139,"p":5,"f":5,"c":20,"tags":["freezer"]},{"n":83,"t":"Banana Ice Cream Bites","ch":"5 Little Sweets","sv":10,"pr":10,"ck":0,"ing":[["banana raw",300],["greek yogurt plain nonfat",180],["peanut butter",30],["mini chocolate chips",60]],"st":["Line a baking sheet with parchment.","Mash the banana with a fork. Mix in the yogurt and peanut butter until smooth.","Drop 10 mounds onto the sheet, about 2 tablespoons each. Freeze 1 hour until firm.","Melt the chocolate chips in the microwave in 20-second bursts, stirring each time.","Dip or drizzle the bites with the chocolate and return to the freezer 2 hours.","Let them stand 3 minutes before eating."],"tp":{"1":"Mash the banana until smooth so the bites freeze evenly.","4":"Dip the bites quickly. The chocolate sets in seconds."},"store":"Freezer 2 months.","kcal":84,"p":3,"f":4,"c":12,"tags":["quick","freezer"]},{"n":84,"t":"Peach Cobbler for Two","ch":"5 Little Sweets","sv":2,"pr":10,"ck":25,"ing":[["peaches canned",400],["rolled oats",60],["greek yogurt plain nonfat",120],["brown sugar",40],["butter",28],["cinnamon ground",2]],"st":["Heat the oven to 375\u00b0F. Drain the peaches well, cut into bite-size pieces and divide between 2 ramekins.","Melt the butter. Mix the oats, brown sugar, butter and cinnamon until crumbly.","Spoon the topping over the peaches.","Set the ramekins on a baking sheet and bake 20 to 25 minutes until bubbling and golden.","Cool 5 minutes. Serve warm with the yogurt."],"tp":{"0":"Drain the peaches well so the cobbler is not watery.","3":"Set the ramekins on a baking sheet to catch any bubbling juices."},"store":"Best fresh. Fridge 2 days.","kcal":419,"p":13,"f":14,"c":66,"tags":[]},{"n":85,"t":"No-Bake Peanut Butter Bites","ch":"5 Little Sweets","sv":12,"pr":10,"ck":0,"ing":[["peanut butter",160],["rolled oats",120],["honey",80],["greek yogurt plain nonfat",60],["mini chocolate chips",60]],"st":["In a bowl, stir the peanut butter, honey and yogurt until smooth.","Stir in the oats and chocolate chips. If the mix is sticky, chill it 10 minutes.","Roll into 12 balls with slightly damp hands.","Place on a plate lined with parchment and chill 30 minutes until firm.","Store in a covered container in the fridge."],"tp":{"1":"If the mixture is sticky, chill it 10 minutes before rolling.","3":"Chill until firm. They hold their shape better."},"store":"Fridge 1 week. Freezer 3 months.","kcal":166,"p":5,"f":9,"c":18,"tags":["quick","freezer"]},{"n":86,"t":"Vanilla Yogurt Panna Cotta Cups","ch":"5 Little Sweets","sv":4,"pr":10,"ck":5,"ing":[["greek yogurt plain nonfat",400],["milk 2%",240],["gelatin powder",14],["honey",60],["vanilla extract",6]],"st":["Pour 60 ml (1/4 cup) of the milk into a small bowl and sprinkle the gelatin on top. Let it sit 5 minutes to soften.","Warm the remaining milk and the honey in a small pot over low heat until steaming, not boiling.","Add the softened gelatin and stir 1 to 2 minutes until fully dissolved. Cool 5 minutes.","Whisk in the yogurt and vanilla until smooth.","Pour into 4 cups. Chill at least 4 hours until set and wobbly.","Top with fruit if you like."],"tp":{"0":"Sprinkle the gelatin over cold milk and let it soften. It will not dissolve evenly if you skip this.","2":"Do not boil the milk. Boiling weakens the gelatin."},"store":"Fridge 4 days.","kcal":151,"p":15,"f":2,"c":19,"tags":["quick"]},{"n":87,"t":"Creamy Ranch Veggie Dip","ch":"6 Snack Time","sv":8,"pr":10,"ck":0,"ing":[["greek yogurt plain nonfat",360],["garlic powder",3],["onion powder",3],["dill dried",2],["chives fresh",8],["lemon juice",15],["carrot raw",200],["cucumber raw",200],["celery raw",150]],"st":["In a bowl, stir the yogurt, garlic powder, onion powder, dill, lemon juice, 1/4 teaspoon salt and pepper.","Mince the chives and stir them in.","Cover and chill 30 minutes so the flavors blend.","Cut the carrots, cucumber and celery into sticks.","Serve the dip in a bowl surrounded by the vegetables."],"tp":{"2":"Chilling lets the flavors blend. The dip tastes better after 30 minutes.","3":"Cut the vegetables the same length so they are easy to dip."},"store":"Dip keeps 5 days.","kcal":47,"p":5,"f":0,"c":6,"tags":["quick"]},{"n":88,"t":"Spinach Artichoke Dip","ch":"6 Snack Time","sv":8,"pr":10,"ck":25,"ing":[["greek yogurt plain nonfat",240],["cream cheese light",120],["spinach raw",150],["artichoke hearts canned",200],["mozzarella part skim",120],["parmesan grated",40],["garlic raw",6]],"st":["Heat the oven to 375\u00b0F. Squeeze the spinach dry if it is cooked, or chop it raw.","Drain and chop the artichoke hearts. Mince the garlic.","In a bowl, mix the cream cheese and yogurt until smooth. Stir in the spinach, artichokes, garlic, half the mozzarella and half the parmesan.","Spread in a small baking dish and top with the remaining cheeses.","Bake 20 to 25 minutes until bubbling and golden.","Rest 5 minutes and serve with toasted bread or vegetables."],"tp":{"0":"Squeeze the spinach dry so the dip is thick and not watery.","4":"The dip is ready when the edges bubble and the top is golden."},"store":"Fridge 4 days.","kcal":127,"p":11,"f":7,"c":7,"tags":[]},{"n":89,"t":"Buffalo Chicken Dip","ch":"6 Snack Time","sv":8,"pr":10,"ck":25,"ing":[["chicken breast raw",500],["greek yogurt plain nonfat",240],["cream cheese light",120],["hot sauce",60],["cheddar cheese",120],["celery raw",150],["garlic powder",2]],"st":["Cook the chicken: simmer in salted water 15 minutes, until 165\u00b0F. Shred it finely with two forks.","Heat the oven to 375\u00b0F.","Mix the cream cheese, yogurt, hot sauce and garlic powder until smooth. Stir in the chicken and half the cheddar.","Spread in a baking dish and top with the remaining cheddar.","Bake 20 minutes until hot and bubbly.","Cut the celery into sticks and serve with the dip."],"tp":{"0":"Shred the chicken finely so it mixes into the dip.","4":"Bake until bubbling at the edges."},"store":"Fridge 4 days.","kcal":189,"p":22,"f":9,"c":3,"tags":[]},{"n":90,"t":"Hummus and Veggie Plate","ch":"6 Snack Time","sv":4,"pr":15,"ck":0,"ing":[["chickpeas canned",480],["lemon juice",45],["olive oil",30],["garlic raw",6],["carrot raw",200],["cucumber raw",200],["bell pepper red raw",150]],"st":["Drain and rinse the chickpeas, keeping about 3 tablespoons of the liquid if you have it.","Add the chickpeas, lemon juice, oil, garlic, 1/2 teaspoon salt and 3 tablespoons water to a blender or food processor.","Blend 2 to 3 minutes, scraping down the sides, until completely smooth. Add water a spoonful at a time if it is too thick.","Cut the carrots, cucumber and pepper into sticks.","Spoon the hummus into a bowl, drizzle with a little oil and serve with the vegetables."],"tp":{"2":"Blend for a few minutes. The longer you blend, the creamier it gets.","3":"Add water a spoonful at a time to reach the thickness you like."},"store":"Hummus keeps 5 days.","kcal":276,"p":10,"f":11,"c":37,"tags":["quick"]},{"n":91,"t":"Deviled Eggs with Yogurt","ch":"6 Snack Time","sv":6,"pr":15,"ck":12,"ing":[["egg whole raw",600],["greek yogurt plain nonfat",90],["dijon mustard",15],["paprika",3],["chives fresh",10]],"st":["Place the eggs in a pot, cover with cold water by 1 inch and bring to a boil. Cover, turn off the heat and let stand 10 minutes.","Cool in ice water 5 minutes. Peel and halve lengthwise.","Pop the yolks into a bowl and mash with the yogurt, mustard and a pinch of salt until smooth.","Spoon or pipe the yolk mixture into the whites.","Dust with paprika and chives. Chill until serving."],"tp":{"0":"Do not boil the eggs. Let them stand in the hot water for 10 minutes.","2":"Mash the yolks until completely smooth before adding the yogurt."},"store":"Fridge 3 days.","kcal":155,"p":14,"f":10,"c":2,"tags":[]},{"n":92,"t":"Turkey Cheese Roll-Ups","ch":"6 Snack Time","sv":6,"pr":10,"ck":0,"ing":[["turkey breast deli sliced",300],["cheddar cheese",150],["dill pickles",120],["cream cheese light",60]],"st":["Pat the turkey slices dry with a paper towel so the spread sticks.","Spread each slice with a thin layer of cream cheese.","Place a slice of cheddar and a pickle spear on one end of each turkey slice.","Roll up tightly and place seam side down on a plate.","Chill 15 minutes, then cut each roll in half."],"tp":{"0":"Pat the slices dry so the cream cheese sticks.","3":"Roll tightly and place seam side down."},"store":"Fridge 4 days.","kcal":177,"p":14,"f":12,"c":3,"tags":["quick"]},{"n":93,"t":"Egg and Cheese Snack Box","ch":"6 Snack Time","sv":4,"pr":10,"ck":12,"ing":[["egg whole raw",400],["cheddar cheese",120],["grapes red raw",200],["whole wheat crackers",100]],"st":["Place the eggs in a pot, cover with cold water by 1 inch and bring to a boil. Cover, turn off the heat and let stand 10 minutes.","Cool in ice water, then peel. Halve them or leave whole.","Cube the cheddar and wash the grapes.","Divide the eggs, cheese, grapes and crackers into 4 containers.","Keep chilled until ready to eat."],"tp":{"1":"Peeling under cold water makes the shell slide off.","4":"Keep the box chilled until you eat."},"store":"Fridge 3 days.","kcal":405,"p":22,"f":23,"c":28,"tags":[]},{"n":94,"t":"Peanut Butter Energy Bites","ch":"6 Snack Time","sv":12,"pr":10,"ck":0,"ing":[["peanut butter",160],["rolled oats",120],["honey",80],["flaxseed ground",30],["mini chocolate chips",40]],"st":["In a bowl, mix the peanut butter, honey, oats, ground flaxseed and chocolate chips until evenly combined.","If the mixture is dry, add a teaspoon of water. If it is sticky, add a spoonful of oats.","Roll into 12 balls with slightly damp hands.","Place on a plate lined with parchment and chill 30 minutes.","Keep in a covered container in the fridge."],"tp":{"1":"Add a spoonful of oats if sticky, or a teaspoon of water if dry.","3":"Chilling makes the bites firm."},"store":"Fridge 1 week. Freezer 3 months.","kcal":168,"p":5,"f":10,"c":18,"tags":["quick","freezer"]},{"n":95,"t":"Apple Slices with Peanut Butter Yogurt Dip","ch":"6 Snack Time","sv":4,"pr":5,"ck":0,"ing":[["apple raw",600],["greek yogurt plain nonfat",240],["peanut butter",60],["honey",30],["cinnamon ground",2]],"st":["In a bowl, whisk the yogurt, peanut butter, honey and cinnamon until smooth.","If the dip is too thick, stir in a teaspoon of water.","Core and slice the apples just before serving so they do not brown. A squeeze of lemon helps.","Serve the dip in a small bowl with the apple slices."],"tp":{"1":"The dip should be thick but spoonable.","2":"Slice the apples just before serving so they stay fresh. A squeeze of lemon helps."},"store":"Dip keeps 3 days. Slice apples fresh.","kcal":227,"p":10,"f":8,"c":33,"tags":["quick"]},{"n":96,"t":"Smoky Paprika Chickpea Crunch","ch":"6 Snack Time","sv":4,"pr":5,"ck":35,"ing":[["chickpeas canned",480],["olive oil",20],["paprika",8],["garlic powder",3]],"st":["Heat the oven to 400\u00b0F. Drain and rinse the chickpeas, then dry them very well with a clean towel. Dry chickpeas get crunchy.","Toss with the oil, paprika, garlic powder and 1/2 teaspoon salt on a sheet pan.","Roast 30 to 35 minutes, shaking the pan every 10 minutes.","They are done when deep golden and they rattle on the pan.","Cool on the pan 10 minutes, since they crisp up as they cool."],"tp":{"0":"Dry the chickpeas completely. Moisture makes them soggy instead of crunchy.","3":"They are ready when they rattle on the pan."},"store":"Airtight 4 days.","kcal":219,"p":9,"f":9,"c":29,"tags":[]},{"n":97,"t":"Tuna Cucumber Bites","ch":"6 Snack Time","sv":4,"pr":10,"ck":0,"ing":[["tuna canned in water drained",240],["greek yogurt plain nonfat",90],["cucumber raw",300],["dijon mustard",10],["dill fresh",5],["lemon juice",15]],"st":["Drain the tuna very well and flake it.","Mix the tuna, yogurt, mustard, chopped dill, lemon juice and a pinch of pepper.","Slice the cucumber into 1/2-inch rounds.","Scoop a spoonful of tuna salad onto each round.","Serve right away or chill up to 30 minutes."],"tp":{"0":"Drain the tuna very well so the topping is not watery.","3":"Use thick cucumber rounds so they hold the topping."},"store":"Fridge 2 days.","kcal":79,"p":15,"f":1,"c":4,"tags":["quick"]},{"n":98,"t":"Mini Pizza Bagels","ch":"6 Snack Time","sv":6,"pr":10,"ck":12,"ing":[["bagel mini",300],["mozzarella part skim",180],["marinara sauce",120],["turkey pepperoni",60],["italian seasoning",2]],"st":["Heat the oven to 400\u00b0F and line a baking sheet with parchment.","Halve the mini bagels and place them cut side up on the sheet. Toast 3 minutes for a crisper base.","Spread each half with 1 teaspoon of marinara.","Top with the mozzarella, turkey pepperoni and a sprinkle of Italian seasoning.","Bake 8 to 10 minutes until the cheese is melted and bubbly.","Cool 2 minutes before eating."],"tp":{"1":"Toast the bagels first so they stay crisp under the toppings.","4":"The cheese should be melted and bubbling."},"store":"Fridge 3 days. Reheat in the oven.","kcal":255,"p":16,"f":7,"c":32,"tags":[]},{"n":99,"t":"Cheddar Cheese Crisps with Chive Yogurt Dip","ch":"6 Snack Time","sv":4,"pr":10,"ck":8,"ing":[["cheddar cheese",120],["paprika",2],["garlic powder",1],["greek yogurt plain nonfat",120],["chives fresh",5],["lemon juice",5]],"st":["Heat the oven to 400\u00b0F and line a baking sheet with parchment. Do not grease it.","Mix the grated cheddar with the paprika and garlic powder.","Place 16 mounds, about 1 tablespoon each, 2 inches apart. Flatten each lightly.","Bake 5 to 8 minutes until golden at the edges and lacy. Watch closely, since they burn quickly.","Cool 5 minutes on the pan. They crisp as they cool.","For the dip, stir the yogurt, chopped chives and lemon juice with a pinch of salt. Serve with the crisps."],"tp":{"2":"Space the mounds well. They spread as they bake.","3":"Watch closely. Cheese goes from golden to burnt in under a minute.","4":"They crisp as they cool, so do not touch them for 5 minutes."},"store":"Airtight 2 days.","kcal":141,"p":10,"f":10,"c":3,"tags":["quick"]},{"n":100,"t":"Strawberry Banana Protein Smoothie","ch":"6 Snack Time","sv":2,"pr":5,"ck":0,"ing":[["greek yogurt plain nonfat",300],["milk 2%",240],["strawberries raw",200],["banana raw",118],["honey",20]],"st":["Hull the strawberries. Peel the banana.","Add the milk first, then the yogurt, strawberries, banana and honey to a blender. Liquids first helps the blades.","Blend 45 to 60 seconds until completely smooth.","Taste and add more honey if you like. Add a few ice cubes if you want it thicker and colder.","Pour into 2 glasses and drink right away."],"tp":{"1":"Add the liquid first. This helps the blender blades pull everything down.","3":"Add a few ice cubes for a thicker, colder smoothie."},"store":"Best fresh.","kcal":263,"p":21,"f":3,"c":41,"tags":["quick"]},{"n":101,"t":"Cottage Cheese Veggie Dip","ch":"6 Snack Time","sv":8,"pr":10,"ck":0,"ing":[["cottage cheese lowfat 2%",450],["greek yogurt plain nonfat",120],["chives fresh",10],["garlic powder",2],["lemon juice",15],["carrot raw",200],["cucumb function frac(x,step){const q=Math.round(x*step)/step;const w=Math.floor(q+1e-9);const f=q-w;let s="";if(Math.abs(f-.25)<.01)s="¼";else if(Math.abs(f-.5)<.01)s="½";else if(Math.abs(f-.75)<.01)s="¾";else if(Math.abs(f-1/3)<.01)s="⅓";else if(Math.abs(f-2/3)<.01)s="⅔";else if(f>.01)s=f.toFixed(2).replace(/0+$/,"");return (w?String(w):"")+s||"0"}

 <div class="meta">${esc(chName(r.ch))} · Recipe ${r.n}</div><h1 style="font-size:28px;margin:4px 0 6px">${esc(r.t)}</h1>
 <div class="meta">Prep ${r.pr} min · ${r.ck?"Cook "+r.ck+" min":"No cooking"} · makes ${sv} serving${sv>1?"s":""}</div>
 <div class="macros"><div><b>${r.kcal}</b><span>CALORIES</span></div><div><b>${r.p} g</b><span>PROTEIN</span></div><div><b>${r.c} g</b><span>CARBS</span></div><div><b>${r.f} g</b><span>FAT</span></div></div>
 <div class="note">Per serving. Estimates based on USDA data.</div>
 <div class="row" style="margin:14px 0 0"><span class="meta"><b>Servings</b></span><div class="seg">${[.5,1,2,3].map(x=>`<button class="${f===x?"on":""}" onclick="st.factor=${x};showR()">${x===.5?"½":x}×</button>`).join("")}</div></div>
 <h2 class="sec">Ingredients</h2><ul class="ing">${r.ing.map(([k,g],i)=>`<li><input type="checkbox"><span>${esc(fmt(k,g*f))}</span></li>`).join("")}</ul>
 <div class="row" style="margin-top:12px"><button class="btn alt sm" onclick="addShop(${r.n})">🛒 Add to shopping list</button></div>
 <h2 class="sec">Instructions</h2><ol class="steps">${r.st.map((s,i)=>`<li>${esc(s)}${r.tp[i]?`<div class="tip">💡 ${esc(r.tp[i])}</div>`:""}</li>`).join("")}</ol>
 <div class="tip"><b>Store &amp; reheat:</b> ${esc(r.store)}</div>
 <div class="row" style="margin-top:18px"><button class="btn go" onclick="startCook(${r.n})">▶ Start cooking</button></div></div></div>`;
}
function tFav(n){st.favs.has(n)?st.favs.delete(n):st.favs.add(n);save();showR();}
function addShop(n){const e=st.shop.find(s=>s.n===n);if(e)e.f=st.factor;else st.shop.push({n,f:st.factor});save();toast("Added to shopping list")}
/* Cooking mode */
let wake=null;
async function lock(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}}
function unlock(){try{wake&&wake.release()}catch(e){}wake=null}
function startCook(n){st.cook={n,i:0};stopTimer();lock();showCook()}
function parseMin(s){const m=s.match(/(\d+)(?:\s*to\s*(\d+))?\s*(minutes?|seconds?)/i);if(!m)return 0;const v=+(m[2]||m[1]);return /second/i.test(m[3])?v:v*60}
function showCook(){
 const c=st.cook,r=R.find(x=>x.n===c.n);let d=$("#cook");if(!d){d=document.createElement("div");d.id="cook";d.className="cook";document.body.appendChild(d)}
 if(c.i>=r.st.length){d.innerHTML=`<div class="in"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center"><div style="font-size:56px">🎉</div><h1 style="color:#fff;font-size:32px;margin:6px 0">Enjoy your meal!</h1><p style="font-size:18px">${esc(r.t)} is ready. Nice cooking.</p><p>Did the recipe work for you? An honest review on Amazon helps other home cooks find the book.</p><p><a class="btn go" href="${REVIEW}" target="_blank" rel="noopener" style="text-decoration:none">Leave an honest review</a></p><p><a href="${LINKS}" target="_blank" rel="noopener" style="color:#fff">More free bonuses and recipes</a></p></div><div class="row"><button class="btn" onclick="endCook()">Close</button></div></div>`;return}
 const s=r.st[c.i],mins=parseMin(s);
 d.innerHTML=`<div class="in"><div class="row" style="justify-content:space-between"><b>${esc(r.t)}</b><button class="btn sm" onclick="endCook()">✕ Close</button></div>
 <div class="prog"><i style="width:${Math.round(100*(c.i+1)/r.st.length)}%"></i></div><div style="font-size:14px;opacity:.8">Step ${c.i+1} of ${r.st.length}</div>
 <div class="txt">${esc(s)}${r.tp[c.i]?`<div class="tip" style="margin-top:14px">💡 ${esc(r.tp[c.i])}</div>`:""}</div>
 ${mins?`<div class="timer" id="tm">${fmtT(timerLeft(mins))}</div><div class="row" style="justify-content:center;margin-bottom:12px"><button class="btn go" onclick="runTimer(${mins})">⏱ Start timer</button><button class="btn" onclick="stopTimer();showCook()">Reset</button></div>`:""}
 <div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn" ${c.i===0?"disabled style='opacity:.4'":""} onclick="stopTimer();st.cook.i--;showCook()">← Back</button><button class="btn go" onclick="stopTimer();st.cook.i++;showCook()">${c.i===r.st.length-1?"Done ✓":"Next →"}</button></div></div>`}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function timerLeft(m){return st.timer&&st.timer.step===st.cook.i&&st.timer.n===st.cook.n?Math.max(0,Math.round((st.timer.end-Date.now())/1000)):m}
function runTimer(m){stopTimer();st.timer={end:Date.now()+m*1000,step:st.cook.i,n:st.cook.n,h:setInterval(()=>{const left=Math.max(0,Math.round((st.timer.end-Date.now())/1000));const e=$("#tm");if(e)e.textContent=fmtT(left);if(left<=0){beep();stopTimer(true)}},500)}}
function stopTimer(done){if(st.timer){clearInterval(st.timer.h);if(!done)st.timer=null;else{const e=$("#tm");if(e)e.textContent="00:00";st.timer=null}}}
function beep(){try{if(navigator.vibrate)navigator.vibrate([300,150,300]);const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}}
function endCook(){stopTimer();unlock();const d=$("#cook");if(d)d.remove();st.cook=null}
render();
</script></body></html>
